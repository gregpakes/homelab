controllers:
  plex:
    strategy: Recreate
    replicas: 1
  
    containers:
      app:
        image:
          repository: lscr.io/linuxserver/plex
          tag: 1.43.4.10903-e5521bd8c-ls324
        env:
          PUID: "1000"
          PGID: "988"
          TZ: "Europe/London"
          # 👇 Tell Plex what to advertise to clients/plex.tv
          ADVERTISE_IP: "http://172.16.51.70:32400,https://plex.gregpakes.co.uk:443"

          # 👇 Make both your LAN and the K3s pod CIDR count as local
          ALLOWED_NETWORKS: "172.16.0.0/16,10.42.0.0/16"

          # 👇 Ensure the fast scratch path is used
          PLEX_TRANSCODE_TMPDIR: "/transcode"

          DOCKER_MODS: "linuxserver/mods:universal-package-install"
          INSTALL_PACKAGES: "intel-media-va-driver-non-free libigdgmm12 libva2 libva-drm2 libdrm2 vainfo"

          # Optional: hint libva (not strictly required on Ubuntu)
          LIBVA_DRIVER_NAME: "iHD"
          VAAPI_DEVICE: "/dev/dri/renderD128" 

        envFrom:
          - secretRef:
              name: plex-env
        resources:
          requests:
            cpu: 1000m
            memory: 4Gi
        securityContext:
          privileged: true

    pod:
      securityContext:
        fsGroup: 988
        # Match these to your host GIDs for video/render
        supplementalGroups: [44, 109, 992]
      labels:
        app: plex

      # All three workers have a GPU passed through (scripts/proxmox-gpu-reset.sh); the
      # masters do not, and are 4 CPU / 6 GB running etcd. Nothing else tells the
      # scheduler Plex needs a GPU node - the Intel device plugin is not deployed, so
      # there is no extended resource to request, and the CharDevice guard further down
      # is a kubelet mount check rather than a scheduler predicate. Without this
      # selector a master placement is accepted and then wedges in ContainerCreating
      # instead of failing as a readable Pending. Same idiom as pihole, traefik and the
      # ARC runners.
      nodeSelector:
        worker: "true"

      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            # Plex and tdarr-node cannot share a GPU. A resource conflict, not a
            # preference - co-scheduling them breaks both.
            - labelSelector:
                matchLabels:
                  app: tdarr-node
              namespaces:
                - servarr
              topologyKey: kubernetes.io/hostname

            # qBittorrent and NZBGet download to /mnt/local-downloads - a hostPath on
            # their own node's disk - and seed over that node's NIC. The service below is
            # externalTrafficPolicy: Local, so every LAN stream enters the cluster through
            # whichever node runs this pod. Sharing a node with the download clients
            # stalls even Direct Play, while the NFS library itself still reads at
            # 75 MB/s.
            #
            # Required rather than weighted: a preferred term only biases scoring, and
            # k3s-06 routinely carries ARC runners (see arc-runners/values-linux.yaml,
            # which documents the scheduler stacking all three onto whichever node looks
            # emptiest). NodeResourcesFit can outweigh the penalty and leave Plex on
            # k3s-05 with the buffering unfixed.
            #
            # The cost: GPUs are on the three workers only and the download clients are
            # pinned to k3s-05, so losing k3s-06 while tdarr-node holds k3s-04 leaves Plex
            # nowhere to go. With the nodeSelector above that surfaces as a plain Pending
            # naming this rule - scale tdarr-node to zero to free k3s-04.
            - labelSelector:
                matchLabels:
                  app: download-clients
              namespaces:
                - servarr
              topologyKey: kubernetes.io/hostname

service:
  app:
    controller: plex
    type: LoadBalancer
    externalTrafficPolicy: Local
    loadBalancerIP: 172.16.51.70  # <-- your reserved IP for Plex
    ports:
      http:
        port: 32400          # TCP 32400 (main)
      gdm1:
        port: 32410
        protocol: UDP        # GDM discovery
      gdm2:
        port: 32412
        protocol: UDP
      gdm3:
        port: 32413
        protocol: UDP
      gdm4:
        port: 32414
        protocol: UDP
      upnp-dlna:
        port: 1900
        protocol: UDP        # DLNA SSDP (optional)
      companion:
        port: 8324 

metrics:
  serviceMonitor:
    enabled: true
    # if you use kube-prometheus-stack, add its selector
    additionalLabels:
      release: kube-prometheus-stack

ingress:
  app:
    annotations:
      traefik.ingress.kubernetes.io/router.middlewares: "plex-plex-headers@kubernetescrd"
    enabled: true
    className: traefik-external
    hosts:
      - host: plex.gregpakes.co.uk
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: app
              port: http
    tls:
      - hosts:
          - plex.gregpakes.co.uk

persistence:
  # 1️⃣ CONFIG on Longhorn (RWO)
  config:
    enabled: true
    storageClass: longhorn
    size: 50Gi
    accessMode: ReadWriteOnce
    retain: true
    globalMounts:
      - path: /config

  # 2️⃣ MEDIA via direct NFS mount (your NAS library)
  media:
    enabled: true
    type: nfs
    server: 172.16.250.191           # <-- your UniFi UNAS IP
    path: /var/nfs/shared/Media      # <-- existing export path
    # readOnly: true                  # enable if you want Plex read-only
    globalMounts:
      - path: /data

  # 3️⃣ TRANSCODE scratch in memory (fast)
  transcode:
    enabled: true
    type: emptyDir
    medium: Memory
    sizeLimit: 8Gi
    globalMounts:
      - path: /transcode

  # 4️⃣ Intel Arc A310 (VAAPI) - direct hostPath, the Intel GPU device plugin is not deployed
  dri:
    enabled: true
    type: hostPath
    hostPath: /dev/dri
    hostPathType: Directory
    globalMounts:
      - path: /dev/dri

  # Guard: /dev/dri exists as an empty directory on a node whose GPU failed to initialise,
  # which silently drops Plex to CPU transcoding. CharDevice makes the pod fail to start instead.
  dri-render:
    enabled: true
    type: hostPath
    hostPath: /dev/dri/renderD128
    hostPathType: CharDevice
    globalMounts:
      - path: /dev/dri/renderD128
