global:
  nodeSelector:
    longhorn: "true"
  tolerations:
    - key: dedicated
      operator: Equal
      value: longhorn
      effect: NoSchedule

# Longhorn 1.12 turned the internal NetworkPolicies ON by default
# (in 1.11 they were gated behind networkPolicies.enabled, which is false here).
# The longhorn-manager policy only permits ingress from other Longhorn pods, which
# blocks the kube-prometheus-stack ServiceMonitor scrape of longhorn-manager:9500.
# Keeping the 1.11 behaviour; revisit if we want to lock this down properly.
networkPolicies:
  restrictInternalTraffic: false

engine:
  tolerations:
    - key: dedicated
      operator: Equal
      value: longhorn
      effect: NoSchedule
  nodeSelector:
    longhorn: "true"

longhornManager:
  nodeSelector:
    longhorn: "true"
  tolerations:
    - key: dedicated
      operator: Equal
      value: longhorn
      effect: NoSchedule
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1

longhornDriver:
  nodeSelector:
    longhorn: "true"
  tolerations:
    - key: dedicated
      operator: Equal
      value: longhorn
      effect: NoSchedule

csi:
  kubeletRootDir: /var/lib/kubelet
  attacher:
    updateStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 1
    nodeSelector: { longhorn: "true" }
    tolerations:
      - key: dedicated
        operator: Equal
        value: longhorn
        effect: NoSchedule
  provisioner:
    updateStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 1
    nodeSelector: { longhorn: "true" }
    tolerations:
      - key: dedicated
        operator: Equal
        value: longhorn
        effect: NoSchedule
  resizer:
    updateStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 1
    nodeSelector: { longhorn: "true" }
    tolerations:
      - key: dedicated
        operator: Equal
        value: longhorn
        effect: NoSchedule
  snapshotter:
    updateStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 1
    nodeSelector: { longhorn: "true" }
    tolerations:
      - key: dedicated
        operator: Equal
        value: longhorn
        effect: NoSchedule

# Reserve a bit of CPU so engines never starve during upgrades
guaranteedEngineCPU: 0.25

defaultSettings:
  defaultDataPath: /var/lib/longhorn
  defaultReplicaCount: 2
  defaultDataLocality: best-effort
  taintToleration: dedicated=longhorn:NoSchedule
  systemManagedComponentsNodeSelector: 'longhorn:true'
  defaultLonghornStaticStorageClass: longhorn
  backupTarget: cifs://172.16.250.191/Backups
  backupTargetCredentialSecret: longhorn-user-smb-backup-secret
  # Still blocks a drain while a node holds an attached volume's last healthy
  # replica, but lets it proceed when that replica is stopped (volume detached).
  # The default, block-if-contains-last-replica, deadlocks node drains: a drain
  # that detaches a degraded volume leaves it unable to rebuild, so the node
  # holding its last replica can never drain.
  nodeDrainPolicy: allow-if-replica-is-stopped

persistence:
  reclaimPolicy: Retain
  volumeBindingMode: WaitForFirstConsumer

metrics:
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack