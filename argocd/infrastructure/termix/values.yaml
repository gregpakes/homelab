controllers:
  termix:
    strategy: Recreate
    replicas: 1
    pod:
      # The descheduler never evicts this (argocd/infrastructure/descheduler):
      # moving Termix drops every open terminal session.
      annotations:
        descheduler.alpha.kubernetes.io/prefer-no-eviction: ""

    containers:
      app:
        image:
          repository: ghcr.io/lukegus/termix
          tag: release-2.9.0
        env:
          PORT: 8080
        ports:
          - name: http
            containerPort: 8080

service:
  main:
    controller: termix
    ports:
      http:
        port: 8080
        targetPort: 8080
        protocol: TCP

ingress:
  main:
    enabled: true
    className: traefik-internal
    hosts:
      - host: termix.gregpakes.co.uk
        paths:
          - path: /
            service:
              identifier: main
              port: http

metrics:
  serviceMonitor:
    enabled: true
    # if you use kube-prometheus-stack, add its selector
    additionalLabels:
      release: kube-prometheus-stack

persistence:
  data:
    enabled: true
    existingClaim: termix-data
    globalMounts:
      - path: /app/data