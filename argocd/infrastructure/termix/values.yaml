controllers:
  termix:
    strategy: Recreate
    replicas: 1
    pod:
      # The descheduler never evicts this (argocd/infrastructure/descheduler):
      # moving Termix drops every open terminal session.
      annotations:
        descheduler.alpha.kubernetes.io/prefer-no-eviction: ""

    containers:
      app:
        image:
          repository: ghcr.io/lukegus/termix
          tag: release-2.9.2
        env:
          PORT: 8080
          # Loads the configMap below, which turns off Nagle's algorithm on
          # every socket Termix opens.
          NODE_OPTIONS: --require /app/preload/nodelay.cjs
        ports:
          - name: http
            containerPort: 8080

service:
  main:
    controller: termix
    ports:
      http:
        port: 8080
        targetPort: 8080
        protocol: TCP

ingress:
  main:
    enabled: true
    className: traefik-internal
    hosts:
      - host: termix.gregpakes.co.uk
        paths:
          - path: /
            service:
              identifier: main
              port: http

metrics:
  serviceMonitor:
    enabled: true
    # if you use kube-prometheus-stack, add its selector
    additionalLabels:
      release: kube-prometheus-stack

# Termix's ssh2 client never calls setNoDelay, so with Nagle on and the
# host's delayed ACK every SSH round trip stalls ~40ms: each keystroke echo
# took 42ms instead of 1.5ms, and a login takes several round trips. Measured
# from inside the pod against k3s-admin on 2026-10-10. Drop this once Termix
# sets TCP_NODELAY itself.
configMaps:
  nodelay:
    data:
      nodelay.cjs: |
        const net = require("node:net");
        const connect = net.Socket.prototype.connect;
        net.Socket.prototype.connect = function (...args) {
          this.setNoDelay(true);
          return connect.apply(this, args);
        };

persistence:
  nodelay:
    type: configMap
    identifier: nodelay
    globalMounts:
      - path: /app/preload/nodelay.cjs
        subPath: nodelay.cjs
        readOnly: true
  data:
    enabled: true
    existingClaim: termix-data
    globalMounts:
      - path: /app/data