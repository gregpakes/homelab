controllers:
  main:
    strategy: Recreate
    pod:
      securityContext:
        fsGroup: 988
        fsGroupChangePolicy: OnRootMismatch
    # Retired: Configarr (argocd/infrastructure/servarr/configarr) now owns Radarr's and
    # Sonarr's profiles and custom formats. Profilarr v1 is EOL and was last synced on
    # 2025-11-07. Kept at zero, with its PVC, until the app is deleted (plan stage 3e).
    replicas: 0
    containers:
      profilarr:
        image:
          repository: santiagosayshey/profilarr
          tag: v1.1.5
        env:
          TZ: Europe/London
        probes:
          liveness:
            enabled: true
            type: HTTP
            port: 6868
          readiness:
            enabled: true
            type: HTTP
            port: 6868

service:
  main:
    controller: main
    ports:
      http:
        port: 6868
        targetPort: 6868
        protocol: TCP

ingress:
  main:
    enabled: true
    className: traefik-internal
    hosts:
      - host: profilarr.gregpakes.co.uk
        paths:
          - path: /
            service:
              identifier: main
              port: http
    # tls:   # optional if your wildcard cert already covers it

persistence:
  config:
    existingClaim: profilarr-config
    enabled: true
    type: persistentVolumeClaim

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi