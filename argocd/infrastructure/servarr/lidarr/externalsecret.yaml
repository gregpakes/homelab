apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lidarr-secrets
  namespace: servarr
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: homelab
  target:
    name: lidarr-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      type: Opaque
  # 1Password item "servarr-api-keys" holds every arr's current key (Settings > General)
  data:
    - secretKey: LIDARR__AUTH__APIKEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: servarr-api-keys
        property: LIDARR_API_KEY
        metadataPolicy: None
        nullBytePolicy: Ignore
