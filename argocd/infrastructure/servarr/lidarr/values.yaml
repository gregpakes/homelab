controllers:
  main:
    strategy: Recreate
    replicas: 1
    pod:
      securityContext:
        fsGroup: 988
        fsGroupChangePolicy: OnRootMismatch
    containers:
      lidarr:
        image:
          repository: ghcr.io/linuxserver/lidarr
          tag: 3.1.0
        env:
          TZ: Europe/London
          PUID: "1000"
          PGID: "988"
          UMASK: "002"
        probes:
          liveness:  { enabled: true,  type: TCP, port: 8686 }
          readiness: { enabled: true,  type: TCP, port: 8686 }

service:
  web:
    controller: main
    type: ClusterIP
    ports:
      http:
        port: 8686
        targetPort: 8686

ingress:
  web:
    enabled: true
    className: traefik-internal
    hosts:
      - host: lidarr.gregpakes.co.uk
        paths:
          - path: /
            service:
              identifier: web
              port: http

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: lidarr-config
    advancedMounts:
      main:
        lidarr:
          - path: /config

  # Same export and mount path as the other arrs and the download clients, so
  # completed downloads need no remote path mapping and imports can hardlink.
  # Point the library root folder at /downloads/media/music.
  downloads:
    enabled: true
    type: nfs
    server: 172.16.250.191
    path: /var/nfs/shared/Media
    advancedMounts:
      main:
        lidarr:
          - path: /downloads
