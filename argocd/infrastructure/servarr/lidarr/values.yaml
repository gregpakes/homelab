controllers:
  main:
    strategy: Recreate
    replicas: 1
    pod:
      securityContext:
        fsGroup: 988
        fsGroupChangePolicy: OnRootMismatch
    containers:
      lidarr:
        image:
          repository: ghcr.io/linuxserver/lidarr
          tag: 3.1.0
        env:
          TZ: Europe/London
          PUID: "1000"
          PGID: "988"
          UMASK: "002"
          # config.xml settings; env wins over the file and over UI edits. Restart to apply.
          # LIDARR__AUTH__APIKEY comes from envFrom below.
          LIDARR__AUTH__METHOD: Forms           # exact case, or it silently falls back to the file
          LIDARR__AUTH__REQUIRED: Enabled
          LIDARR__SERVER__PORT: "8686"
          LIDARR__LOG__LEVEL: info
          LIDARR__LOG__ANALYTICSENABLED: "False"
          LIDARR__UPDATE__MECHANISM: Docker
          LIDARR__UPDATE__AUTOMATICALLY: "False"
          LIDARR__UPDATE__BRANCH: master
        # optional: if the secret is missing, Lidarr starts with the key already in config.xml
        envFrom:
          - secretRef: { name: lidarr-secrets, optional: true }
        probes:
          liveness:  { enabled: true,  type: TCP, port: 8686 }
          readiness: { enabled: true,  type: TCP, port: 8686 }

service:
  web:
    controller: main
    type: ClusterIP
    ports:
      http:
        port: 8686
        targetPort: 8686

ingress:
  web:
    enabled: true
    className: traefik-internal
    hosts:
      - host: lidarr.gregpakes.co.uk
        paths:
          - path: /
            service:
              identifier: web
              port: http

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: lidarr-config
    advancedMounts:
      main:
        lidarr:
          - path: /config

  # Same export and mount path as the other arrs and the download clients, so
  # completed downloads need no remote path mapping and imports can hardlink.
  # Point the library root folder at /downloads/media/music.
  downloads:
    enabled: true
    type: nfs
    server: 172.16.250.191
    path: /var/nfs/shared/Media
    advancedMounts:
      main:
        lidarr:
          - path: /downloads
