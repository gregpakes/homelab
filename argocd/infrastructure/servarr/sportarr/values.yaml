controllers:
  main:
    strategy: Recreate
    replicas: 1
    pod:
      securityContext:
        fsGroup: 988
        fsGroupChangePolicy: OnRootMismatch
    initContainers:
      # Sportarr only checks the API key in config.xml (its Sportarr__ApiKey env is not
      # used for auth), so pin the key there from 1Password on every start.
      apikey:
        image:
          repository: alpine
          tag: "3.24"
        # optional: with no secret the script leaves config.xml alone
        envFrom:
          - secretRef: { name: sportarr-secrets, optional: true }
        command: ["/bin/sh", "-c"]
        args:
          - |
            f=/config/config.xml
            if [ -n "$SPORTARR_API_KEY" ] && [ -f "$f" ] && grep -q '<ApiKey>' "$f"; then
              sed "s|<ApiKey>[^<]*</ApiKey>|<ApiKey>${SPORTARR_API_KEY}</ApiKey>|" "$f" > /tmp/config.xml
              # cat into the existing file keeps its owner and mode
              cat /tmp/config.xml > "$f"
            fi
    containers:
      sportarr:
        image:
          repository: sportarr/sportarr
          tag: 4.1.10.1120
        env:
          TZ: Europe/London
          PUID: "1000"
          PGID: "988"
          UMASK: "002"
          Sportarr__Port: "1867"
          Sportarr__BindAddress: "*"
        probes:
          liveness:  { enabled: true,  type: TCP, port: 1867 }
          readiness: { enabled: true,  type: TCP, port: 1867 }

service:
  web:
    controller: main
    type: ClusterIP
    ports:
      http:
        port: 1867
        targetPort: 1867

ingress:
  web:
    enabled: true
    className: traefik-internal
    hosts:
      - host: sportarr.gregpakes.co.uk
        paths:
          - path: /
            service:
              identifier: web
              port: http

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: sportarr-config
    advancedMounts:
      main:
        apikey:
          - path: /config
        sportarr:
          - path: /config

  # Same export and mount path as sonarr and the download clients, so completed
  # downloads need no remote path mapping and imports can hardlink. Point the
  # library root folder at /downloads/media/sports.
  downloads:
    enabled: true
    type: nfs
    server: 172.16.250.191
    path: /var/nfs/shared/Media
    advancedMounts:
      main:
        sportarr:
          - path: /downloads
