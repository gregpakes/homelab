apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bazarr-secrets
  namespace: servarr
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: homelab
  target:
    name: bazarr-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      type: Opaque
  # 1Password items: "servarr-api-keys" holds every arr's current key (Settings > General),
  # "bazarr" holds the OpenSubtitles.com login
  data:
    - secretKey: SONARR_API_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: servarr-api-keys
        property: SONARR_API_KEY
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: RADARR_API_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: servarr-api-keys
        property: RADARR_API_KEY
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: OPENSUBTITLESCOM_USERNAME
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: bazarr
        property: OPENSUBTITLESCOM_USERNAME
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: OPENSUBTITLESCOM_PASSWORD
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: bazarr
        property: OPENSUBTITLESCOM_PASSWORD
        metadataPolicy: None
        nullBytePolicy: Ignore
