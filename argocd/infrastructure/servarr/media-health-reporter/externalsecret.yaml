apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: media-health-reporter-secrets
  namespace: servarr
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: homelab
  target:
    name: media-health-reporter-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      type: Opaque
      engineVersion: v2
      data:
        LIDARR_API_KEY: "{{ .lidarr }}"
        RADARR_API_KEY: "{{ .radarr }}"
        SONARR_API_KEY: "{{ .sonarr }}"
        HA_WEBHOOK_URL: "http://172.16.30.124:8123/api/webhook/{{ .webhook }}"
  # 1Password items: "servarr-api-keys" holds every arr's key; "media-alerts-webhooks"
  # the Home Assistant webhook IDs (health-webhook-id is the "Media: health report" one).
  data:
    - secretKey: lidarr
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: servarr-api-keys
        property: LIDARR_API_KEY
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: radarr
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: servarr-api-keys
        property: RADARR_API_KEY
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: sonarr
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: servarr-api-keys
        property: SONARR_API_KEY
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: webhook
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: media-alerts-webhooks
        property: health-webhook-id
        metadataPolicy: None
        nullBytePolicy: Ignore
