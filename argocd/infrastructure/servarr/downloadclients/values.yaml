# servarr/qbit-vpn/values.yaml
controllers:
  main:
    strategy: Recreate
    replicas: 1
    pod:
      labels:
        app: download-clients
      nodeSelector:
        kubernetes.io/hostname: k3s-05 # Pin to 05 because we download to local path due to perf issues when downloading directly to the NFS drive
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 127.0.0.1
        options:
          - name: ndots
            value: "1"

      securityContext:
        fsGroup: 988
        fsGroupChangePolicy: OnRootMismatch
    containers:
      gluetun:
        image:
          repository: qmcgaw/gluetun
          tag: v3.41.3
        env:
          TZ: Europe/London

          # --- AirVPN over WireGuard ---
          VPN_SERVICE_PROVIDER: airvpn
          VPN_TYPE: wireguard
          WIREGUARD_PRIVATE_KEY:
            valueFrom: { secretKeyRef: { name: gluetun-secrets, key: WIREGUARD_PRIVATE_KEY } }
          WIREGUARD_PUBLIC_KEY:
            valueFrom: { secretKeyRef: { name: gluetun-secrets, key: WIREGUARD_PUBLIC_KEY } }
          WIREGUARD_PRESHARED_KEY:
            valueFrom: { secretKeyRef: { name: gluetun-secrets, key: WIREGUARD_PRESHARED_KEY } }
          WIREGUARD_ADDRESSES:
            valueFrom: { secretKeyRef: { name: gluetun-secrets, key: WIREGUARD_ADDRESSES } }

          # Health & firewall
          # The kill switch is deliberately ON. A `FIREWALL: "off"` line sat here
          # until 2026-10, but gluetun v3.39 dropped that variable, so it was ignored
          # and the firewall was on all along. Never set its replacement,
          # FIREWALL_ENABLED_DISABLING_IT_SHOOTS_YOU_IN_YOUR_FOOT: with it off,
          # qBittorrent and NZBGet traffic could leave outside the VPN.
          HEALTH_TARGET_ADDRESSES: "1.1.1.1:53"
          FIREWALL_VPN_INPUT_PORTS:
            valueFrom: { secretKeyRef: { name: gluetun-secrets, key: FIREWALL_VPN_INPUT_PORTS } }

          # Allow LAN/cluster to reach WebUI on 8080
          FIREWALL_INPUT_PORTS: "8080,53,6789"

          # let the pod talk to the cluster and NAS directly (no leak of Internet traffic)
          FIREWALL_OUTBOUND_SUBNETS: "10.42.0.0/16,10.43.0.0/16,172.16.51.0/24,172.16.250.191/32"

          # this dns config tells gluetun to start using plaintext dns, then switch over to DoT when ready
          DNS_SERVER: "on"
          DNS_OVER_TLS: "cloudflare"
          DNS_ADDRESS: "127.0.0.1" 

          BLOCK_MALICIOUS: "off"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add: ["NET_ADMIN"]

      qbittorrent:
        image:
          repository: ghcr.io/linuxserver/qbittorrent
          tag: 5.3.0-libtorrentv1 # We use libtorrentv1 tag due to memory leak in libtorrent v2 (latest tag)
        env:
          TZ: Europe/London
          PUID: "1000"
          PGID: "988"
          WEBUI_PORT: "8080"
          # The port AirVPN forwards (one port: qBittorrent won't start on a list).
          # linuxserver passes it as --torrenting-port,
          # which qBittorrent writes to Session\Port on every start. The rest of
          # qBittorrent's git-owned settings are in the qbt-config configMap below.
          TORRENTING_PORT:
            valueFrom: { secretKeyRef: { name: gluetun-secrets, key: FIREWALL_VPN_INPUT_PORTS } }

        ports:
          - name: http
            containerPort: 8080
            protocol: TCP
          - name: bt-tcp
            containerPort: 6881
            protocol: TCP
          - name: bt-udp
            containerPort: 6881
            protocol: UDP

        # readiness probe to qbittorrent waits for glutun to be healthy
        probes:
          readiness:
            enabled: true
            type: TCP
            port: 8080
          liveness:
            enabled: true
            type: TCP
            port: 8080

      nzbget:
        image:
          repository: ghcr.io/linuxserver/nzbget
          tag: version-v26.3
        env:
          TZ: Europe/London
          PUID: "1000"
          PGID: "988"
        # Logins for the nzbget-config script. optional: with no secret it
        # leaves them alone.
        envFrom:
          - secretRef: { name: nzbget-secrets, optional: true }
        ports:
          - name: httpnzb
            containerPort: 6789
            protocol: TCP
service:
  webui:
    controller: main
    type: ClusterIP
    ports:
      http:
        port: 8080
        targetPort: http
        protocol: TCP

  nzbgetui:
    controller: main
    type: ClusterIP
    ports:
      http:
        port: 6789
        targetPort: httpnzb
        protocol: TCP
      
  bittorrent:
    controller: main
    type: ClusterIP
    ports:
      tcp:
        port: 6881
        targetPort: bt-tcp
        protocol: TCP
      udp:
        port: 6881
        targetPort: bt-udp
        protocol: UDP

ingress:
  webui:
    enabled: true
    className: traefik-internal
    hosts:
      - host: qbit.gregpakes.co.uk
        paths:
          - path: /
            service:
              identifier: webui
              port: http
  nzbgetui:
    enabled: true
    className: traefik-internal
    hosts:
      - host: nzbget.gregpakes.co.uk
        paths:
          - path: /
            service:
              identifier: nzbgetui
              port: http
    # tls: [...]   # optional

# Settings git owns. linuxserver runs /custom-cont-init.d as root on every
# start, after it creates a default config and before the app reads it, so
# these keys win over UI edits once the pod restarts. Settings not listed
# here stay in the UI.
configMaps:
  qbt-config:
    data:
      10-qbt-config.sh: |
        #!/bin/bash
        set -euo pipefail

        conf=/config/qBittorrent/qBittorrent.conf

        # ini_set SECTION KEY VALUE sets KEY=VALUE in [SECTION], adding the key
        # or the section if missing. awk reads its arguments from ENVIRON
        # because -v expands backslash escapes, which would mangle Session\Port.
        ini_set() {
          local tmp
          tmp=$(mktemp)
          S="$1" K="$2" V="$3" awk '
            BEGIN { sec = "[" ENVIRON["S"] "]"; key = ENVIRON["K"] "="; line = key ENVIRON["V"] }
            /^\[/ {
              if (in_sec && !done) { print line; done = 1 }
              in_sec = ($0 == sec)
              if (in_sec) seen = 1
            }
            in_sec && index($0, key) == 1 {
              if (!done) { print line; done = 1 }
              next
            }
            { print }
            END {
              if (!done) {
                if (!seen) print sec
                print line
              }
            }
          ' "$conf" > "$tmp"
          # cat into the existing file keeps its owner and mode
          cat "$tmp" > "$conf"
          rm -f "$tmp"
        }

        # Only the WireGuard tunnel. gluetun's kill switch blocks any other
        # route anyway.
        ini_set BitTorrent 'Session\Interface' tun0
        ini_set BitTorrent 'Session\InterfaceName' tun0

        # Downloads go to k3s-05's local disk, then move to the NFS share
        ini_set BitTorrent 'Session\DefaultSavePath' /downloads/downloads/qbittorrent/completed
        ini_set BitTorrent 'Session\TempPath' /mnt/local-downloads/qbittorrent/incomplete
        ini_set BitTorrent 'Session\TempPathEnabled' true

        ini_set BitTorrent 'Session\QueueingSystemEnabled' true
        ini_set BitTorrent 'Session\MaxActiveDownloads' 3
        ini_set BitTorrent 'Session\MaxActiveUploads' 10
        ini_set BitTorrent 'Session\MaxActiveTorrents' 13
        ini_set BitTorrent 'Session\MaxActiveCheckingTorrents' 1
        ini_set BitTorrent 'Session\IgnoreSlowTorrentsForQueueing' true
        ini_set BitTorrent 'Session\SlowTorrentsDownloadRate' 5
        ini_set BitTorrent 'Session\SlowTorrentsUploadRate' 5
        ini_set BitTorrent 'Session\SlowTorrentsInactivityTimer' 60

        # KiB/s here; the API reports bytes (2048000 and 1280000)
        ini_set BitTorrent 'Session\GlobalDLSpeedLimit' 2000
        ini_set BitTorrent 'Session\GlobalUPSpeedLimit' 1250

        ini_set BitTorrent 'Session\DHTEnabled' true
        ini_set BitTorrent 'Session\PeXEnabled' true
        ini_set BitTorrent 'Session\LSDEnabled' true

        # Categories the arrs add to. A category missing from this file is
        # recreated when a torrent is added with it.
        install -m 644 /git/qbittorrent/categories.json /config/qBittorrent/categories.json

        lsiown abc:abc /config/qBittorrent/qBittorrent.conf /config/qBittorrent/categories.json
      # Copied from the live file, in the format qBittorrent 5.3 writes
      categories.json: |
        {
            "Movies": {
                "download_path": null,
                "inactive_seeding_time_limit": -2,
                "ratio_limit": -2,
                "save_path": "",
                "seeding_time_limit": -2,
                "share_limit_action": "Default",
                "share_limits_mode": "Default"
            },
            "lidarr": {
                "download_path": null,
                "inactive_seeding_time_limit": -2,
                "ratio_limit": -2,
                "save_path": "",
                "seeding_time_limit": -2,
                "share_limit_action": "Default",
                "share_limits_mode": "Default"
            },
            "radarr": {
                "download_path": null,
                "inactive_seeding_time_limit": -2,
                "ratio_limit": -2,
                "save_path": "",
                "seeding_time_limit": -2,
                "share_limit_action": "Default",
                "share_limits_mode": "Default"
            },
            "sportarr": {
                "download_path": null,
                "inactive_seeding_time_limit": -2,
                "ratio_limit": -2,
                "save_path": "",
                "seeding_time_limit": -2,
                "share_limit_action": "Default",
                "share_limits_mode": "Default"
            },
            "tv-sonarr": {
                "download_path": null,
                "inactive_seeding_time_limit": -2,
                "ratio_limit": -2,
                "save_path": "",
                "seeding_time_limit": -2,
                "share_limit_action": "Default",
                "share_limits_mode": "Default"
            }
        }

  # NZBGet reads nzbget.conf when it starts or reloads; a UI save alone
  # changes nothing live.
  nzbget-config:
    data:
      10-nzbget-config.sh: |
        #!/bin/bash
        set -euo pipefail

        conf=/config/nzbget.conf

        # kv_set KEY VALUE sets KEY=VALUE, adding the line if missing. awk reads
        # its arguments from ENVIRON because -v expands backslash escapes,
        # which would mangle passwords.
        kv_set() {
          local tmp
          tmp=$(mktemp)
          K="$1" V="$2" awk '
            BEGIN { key = ENVIRON["K"] "="; line = key ENVIRON["V"] }
            index($0, key) == 1 {
              if (!done) { print line; done = 1 }
              next
            }
            { print }
            END { if (!done) print line }
          ' "$conf" > "$tmp"
          # cat into the existing file keeps its owner and mode
          cat "$tmp" > "$conf"
          rm -f "$tmp"
        }

        # Logins come from nzbget-secrets and are skipped when it is missing
        if [[ -n ${CONTROL_USERNAME:-} && -n ${CONTROL_PASSWORD:-} ]]; then
          kv_set ControlUsername "$CONTROL_USERNAME"
          kv_set ControlPassword "$CONTROL_PASSWORD"
        fi

        # Work happens on k3s-05's local disk; only finished jobs go to the NFS
        # share, which is the one path the arrs can read
        kv_set MainDir /config
        kv_set DestDir /downloads/downloads/nzbget/completed
        kv_set InterDir /mnt/local-downloads/nzbget/intermediate
        kv_set NzbDir /mnt/local-downloads/nzbget/nzb
        kv_set QueueDir /mnt/local-downloads/nzbget/queue
        kv_set TempDir /mnt/local-downloads/nzbget/tmp
        kv_set ScriptDir /mnt/local-downloads/nzbget/scripts

        # Radarr sends Movies, Sonarr Series, Lidarr Music. An empty DestDir
        # means DestDir/<Name>.
        n=1
        for name in Movies Series Music Software Prowlarr; do
          kv_set "Category$n.Name" "$name"
          kv_set "Category$n.DestDir" ""
          kv_set "Category$n.Unpack" yes
          kv_set "Category$n.Extensions" ""
          kv_set "Category$n.Aliases" ""
          n=$((n + 1))
        done

        # server NUM NAME HOST LEVEL CONNECTIONS. Level 0 is tried first; a
        # higher level only fetches articles the lower ones failed.
        server() {
          kv_set "Server$1.Active" yes
          kv_set "Server$1.Name" "$2"
          kv_set "Server$1.Host" "$3"
          kv_set "Server$1.Port" 563
          kv_set "Server$1.Encryption" yes
          kv_set "Server$1.CertVerification" Strict
          kv_set "Server$1.Level" "$4"
          kv_set "Server$1.Connections" "$5"
        }
        # UsenetExpress caps the account at 75 connections and keeps counting
        # sockets NZBGet abandons after a hang. 20 stays under the cap; 35 did not.
        server 1 UNE news-eu.usenetexpress.com 0 20
        server 2 Usenet.Farm news.usenet.farm 50 40

        if [[ -n ${NEWS1_USERNAME:-} && -n ${NEWS1_PASSWORD:-} ]]; then
          kv_set Server1.Username "$NEWS1_USERNAME"
          kv_set Server1.Password "$NEWS1_PASSWORD"
        fi
        if [[ -n ${NEWS2_USERNAME:-} && -n ${NEWS2_PASSWORD:-} ]]; then
          kv_set Server2.Username "$NEWS2_USERNAME"
          kv_set Server2.Password "$NEWS2_PASSWORD"
        fi

        lsiown abc:abc "$conf"

persistence:
  qbt-config:
    type: configMap
    identifier: qbt-config
    defaultMode: 493 # 0755: linuxserver skips init scripts that aren't executable
    advancedMounts:
      main:
        qbittorrent:
          - path: /custom-cont-init.d/10-qbt-config.sh
            subPath: 10-qbt-config.sh
            readOnly: true
          - path: /git/qbittorrent/categories.json
            subPath: categories.json
            readOnly: true

  nzbget-config:
    type: configMap
    identifier: nzbget-config
    defaultMode: 493 # 0755: linuxserver skips init scripts that aren't executable
    advancedMounts:
      main:
        nzbget:
          - path: /custom-cont-init.d/10-nzbget-config.sh
            subPath: 10-nzbget-config.sh
            readOnly: true

  dev-tun:
    enabled: true
    type: hostPath
    hostPath: /dev/net/tun
    hostPathType: CharDevice
    advancedMounts:
      main:
        gluetun:
          - path: /dev/net/tun

  config:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: download-clients-qbit-config
    advancedMounts:
      main:
        qbittorrent:
          - path: /config

  nzb-config:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: download-clients-nzbget-config
    advancedMounts:
      main:
        nzbget:
          - path: /config

  downloads:
    enabled: true
    type: nfs
    server: 172.16.250.191
    path: /var/nfs/shared/Media
    advancedMounts:
      main:
        qbittorrent:
          - path: /downloads
        nzbget:
          - path: /downloads

  local-downloads:
    enabled: true
    type: hostPath
    hostPath: /mnt/local-downloads
    hostPathType: DirectoryOrCreate
    advancedMounts:
      main:
        qbittorrent:
          - path: /mnt/local-downloads
        nzbget:
          - path: /mnt/local-downloads
