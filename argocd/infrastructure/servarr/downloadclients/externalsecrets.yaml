apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gluetun-secrets
  namespace: servarr
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: homelab
  target:
    name: gluetun-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: WIREGUARD_PRIVATE_KEY
      remoteRef:
        key: gluetun-secrets
        property: WIREGUARD_PRIVATE_KEY
        nullBytePolicy: Ignore
    # Optional, if you set them in 1Password:
    - secretKey: WIREGUARD_ADDRESSES
      remoteRef:
        key: gluetun-secrets
        property: WIREGUARD_ADDRESSES
        nullBytePolicy: Ignore
    - secretKey: WIREGUARD_PUBLIC_KEY
      remoteRef:
        key: gluetun-secrets
        property: WIREGUARD_PUBLIC_KEY
        nullBytePolicy: Ignore
    - secretKey: WIREGUARD_PRESHARED_KEY
      remoteRef:
        key: gluetun-secrets
        property: WIREGUARD_PRESHARED_KEY
        nullBytePolicy: Ignore
    - secretKey: FIREWALL_VPN_INPUT_PORTS
      remoteRef:
        key: gluetun-secrets
        property: FIREWALL_VPN_INPUT_PORTS
        nullBytePolicy: Ignore
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nzbget-secrets
  namespace: servarr
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: homelab
  target:
    name: nzbget-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      type: Opaque
  # 1Password item "nzbget": the web UI login the arrs use, and each news server's login
  data:
    - secretKey: CONTROL_USERNAME
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: nzbget
        property: CONTROL_USERNAME
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: CONTROL_PASSWORD
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: nzbget
        property: CONTROL_PASSWORD
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: NEWS1_USERNAME
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: nzbget
        property: NEWS1_USERNAME
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: NEWS1_PASSWORD
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: nzbget
        property: NEWS1_PASSWORD
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: NEWS2_USERNAME
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: nzbget
        property: NEWS2_USERNAME
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: NEWS2_PASSWORD
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: nzbget
        property: NEWS2_PASSWORD
        metadataPolicy: None
        nullBytePolicy: Ignore
