controllers:
  server:
    strategy: Recreate
    replicas: 1
    pod:
      securityContext:
        fsGroup: 988
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [44, 992]
      labels:
        app: tdarr-server
    initContainers:
      perms:
        image:
          repository: alpine
          tag: "3.24"
        command: ["/bin/sh", "-c"]
        args:
          - |
            mkdir -p /temp /app/server /app/configs &&
            chown -R 1000:988 /temp /app/server /app/configs &&
            chmod -R u+rwX,g+rwX /temp /app/server /app/configs
        securityContext:
          runAsUser: 0
          runAsGroup: 0

      flow-plugins:
        image:
          repository: alpine
          tag: "3.24"
        command: ["/bin/sh", "-c"]
        args:
          - |
            mkdir -p /app/server/Tdarr/Plugins/FlowPlugins/LocalFlowPlugins/Custom/hasNonEnglishTracks/1.0.0 &&
            cp /plugin-src/hasNonEnglishTracks.js /app/server/Tdarr/Plugins/FlowPlugins/LocalFlowPlugins/Custom/hasNonEnglishTracks/1.0.0/index.js
        securityContext:
          runAsUser: 0
          runAsGroup: 0

    containers:
      tdarr:
        image:
          repository: docker.io/haveagitgat/tdarr
          tag: 2.89.01
        env:
          TZ: Europe/London
          PUID: "1000"
          PGID: "988"

  node:
    strategy: Recreate
    replicas: 1
    pod:
      securityContext:
        fsGroup: 988
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [44, 992]
      labels:
        app: tdarr-node
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: plex
              namespaces:
                - plex
              topologyKey: kubernetes.io/hostname
    initContainers:
      perms:
        image:
          repository: alpine
          tag: "3.24"
        command: ["/bin/sh", "-c"]
        args:
          - |
            mkdir -p /temp &&
            chown -R 1000:988 /temp &&
            chmod -R u+rwX,g+rwX /temp
        securityContext:
          runAsUser: 0
          runAsGroup: 0

      flow-plugins:
        image:
          repository: alpine
          tag: "3.24"
        command: ["/bin/sh", "-c"]
        args:
          - |
            mkdir -p /app/server/Tdarr/Plugins/FlowPlugins/LocalFlowPlugins/Custom/hasNonEnglishTracks/1.0.0 &&
            cp /plugin-src/hasNonEnglishTracks.js /app/server/Tdarr/Plugins/FlowPlugins/LocalFlowPlugins/Custom/hasNonEnglishTracks/1.0.0/index.js
        securityContext:
          runAsUser: 0
          runAsGroup: 0

      ffsubsync:
        image:
          repository: python
          tag: "3.14-slim"
        command: ["/bin/sh", "-c"]
        args:
          - |
            apt-get update && apt-get install -y --no-install-recommends gcc g++ make \
            && rm -rf /var/lib/apt/lists/* \
            && pip install --no-cache-dir --target=/pytools ffsubsync \
            && sed -i '1s|^#!.*$|#!/usr/bin/env python3|' /pytools/bin/ffsubsync

      ffsubsync-script:
        image:
          repository: alpine
          tag: "3.24"
        command: ["/bin/sh", "-c"]
        args:
          - |
            mkdir -p /temp/scripts && \
            cat > /temp/scripts/ffsubsync.sh <<'EOF'
            #!/usr/bin/env bash
            set -euo pipefail

            VIDEO="${1}"
            DIR="$(dirname "$VIDEO")"
            BASE="$(basename "$VIDEO")"
            NAME="${BASE%.*}"

            MARKER="Synced by ffsubsync"

            shopt -s nullglob
            for SRT in "$DIR/$NAME"*.srt; do
              # skip already processed to prevent loops
              if head -c 4000 "$SRT" | grep -q "$MARKER"; then
                continue
              fi

              TMP="${SRT}.synced"
              /pytools/bin/ffsubsync "$VIDEO" -i "$SRT" -o "$TMP"

              { printf "1\n00:00:00,000 --> 00:00:00,001\n%s\n\n" "$MARKER"; cat "$TMP"; } > "$TMP.marked"
              mv "$TMP.marked" "$SRT"
              rm -f "$TMP"
            done
            EOF
            chmod +x /temp/scripts/ffsubsync.sh
        securityContext:
          runAsUser: 0
          runAsGroup: 0
      
    containers:
      tdarr-node:
        image:
          repository: docker.io/haveagitgat/tdarr_node
          tag: 2.88.01
        env:
          TZ: Europe/London
          serverIP: tdarr-server
          serverPort: "8266"
          nodeID: tdarr-node

          PYTHONPATH: /pytools
          PATH: /pytools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        resources:
          requests:
            ephemeral-storage: "1Gi"
          limits:
            ephemeral-storage: "2Gi"

service:
  web:
    controller: server
    type: ClusterIP
    ports:
      http:
        port: 8265
        protocol: TCP

  server:
    controller: server
    type: ClusterIP
    ports:
      server:
        port: 8266
        protocol: TCP

ingress:
  web:
    enabled: true
    className: traefik-internal
    hosts:
      - host: tdarr.gregpakes.co.uk
        paths:
          - path: /
            service:
              identifier: web
              port: http

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: tdarr-config
    advancedMounts:
      server:
        perms:
          - path: /app/configs
        tdarr:
          - path: /app/configs

  server-data:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: tdarr-server
    advancedMounts:
      server:
        perms:
          - path: /app/server
        flow-plugins:
          - path: /app/server
        tdarr:
          - path: /app/server

  # GPU passthrough
  dri:
    enabled: true
    type: hostPath
    hostPath: /dev/dri
    hostPathType: Directory
    advancedMounts:
      server:
        tdarr:
          - path: /dev/dri
      node:
        tdarr-node:
          - path: /dev/dri

  # Guard: /dev/dri exists as an empty directory on a node whose Arc A310 failed
  # to initialise, so the directory mount above happily succeeds and tdarr-node
  # silently transcodes on CPU. CharDevice makes the pod fail to start instead.
  # Mounted on the node only - the server does not transcode, and taking the web
  # UI down would remove the means of noticing. See argocd/readme.md for the
  # A310 reset quirk and scripts/proxmox-gpu-reset.sh.
  dri-render:
    enabled: true
    type: hostPath
    hostPath: /dev/dri/renderD128
    hostPathType: CharDevice
    advancedMounts:
      node:
        tdarr-node:
          - path: /dev/dri/renderD128

  cache:
    enabled: true
    type: hostPath
    hostPath: /mnt/tdarr-cache
    hostPathType: DirectoryOrCreate
    globalMounts:
      - path: /temp

  media:
    enabled: true
    type: nfs
    server: 172.16.250.191
    path: /var/nfs/shared/Media
    globalMounts:
      - path: /media

  # Store Tdarr's built-in nightly backups directly on the NAS.
  backups:
    enabled: true
    type: nfs
    server: 172.16.250.191
    path: /var/nfs/shared/Backups/Tdarr
    advancedMounts:
      server:
        tdarr:
          - path: /app/server/Tdarr/Backups
  
  pytools:
    enabled: true
    type: emptyDir
    advancedMounts:
      node:
        # ffsubsync populates /pytools (pip install --target=/pytools);
        # tdarr-node consumes it via PATH/PYTHONPATH.
        ffsubsync:
          - path: /pytools
        tdarr-node:
          - path: /pytools

  flow-plugins:
    enabled: true
    type: configMap
    name: tdarr-flow-plugins
    advancedMounts:
      server:
        flow-plugins:
          - path: /plugin-src
            readOnly: true
      node:
        flow-plugins:
          - path: /plugin-src
            readOnly: true

# NOTE: a top-level `advancedMounts:` block used to live here. app-template has
# no such top-level key, so it was inert, and `dri` and `pytools` were in fact
# mounted into *every* container of *both* controllers by the chart's default
# for an item that declares no mounts of its own (a hostPath defaults to its
# own hostPath, an emptyDir to /<name>). Both are now scoped per persistence
# item above, as every other item here is. Note that `pytools` is scoped to the
# ffsubsync init container as well as tdarr-node: ffsubsync is what populates
# the emptyDir, and it was only receiving it via that accidental default.
