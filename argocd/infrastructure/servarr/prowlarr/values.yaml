# argocd/infrastructure/servarr/prowlarr/values.yaml
controllers:
  main:
    strategy: Recreate
    replicas: 1
    pod:
      securityContext:
        fsGroup: 988                # allow writes to NFS (PGID=988)
        fsGroupChangePolicy: OnRootMismatch
    containers:
      prowlarr:
        image:
          repository: lscr.io/linuxserver/prowlarr
          tag: 2.6.5
        env:
          TZ: Europe/London
          PUID: "1000"
          PGID: "988"
          # config.xml settings; env wins over the file and over UI edits. Restart to apply.
          # PROWLARR__AUTH__APIKEY comes from envFrom below.
          PROWLARR__AUTH__METHOD: Forms         # exact case, or it silently falls back to the file
          PROWLARR__AUTH__REQUIRED: Enabled
          PROWLARR__SERVER__PORT: "9696"
          PROWLARR__LOG__LEVEL: info
          PROWLARR__LOG__ANALYTICSENABLED: "False"
          PROWLARR__UPDATE__MECHANISM: Docker
          PROWLARR__UPDATE__AUTOMATICALLY: "False"
          PROWLARR__UPDATE__BRANCH: master
        # optional: if the secret is missing, Prowlarr starts with the key already in config.xml
        envFrom:
          - secretRef: { name: prowlarr-secrets, optional: true }
        ports:
          - name: http
            containerPort: 9696
            protocol: TCP
        probes:
          readiness:
            enabled: true
            type: HTTP
            port: http
            path: /
          liveness:
            enabled: true
            type: HTTP
            port: http
            path: /

service:
  web:
    controller: main
    type: ClusterIP
    ports:
      http:
        port: 9696
        targetPort: http
        protocol: TCP

ingress:
  web:
    enabled: true
    className: traefik-internal
    hosts:
      - host: prowlarr.gregpakes.co.uk
        paths:
          - path: /
            service:
              identifier: web
              port: http


persistence:
  config:
    enabled: true
    existingClaim: prowlarr-config
    type: persistentVolumeClaim
    advancedMounts:
      main:
        prowlarr:
          - path: /config

  downloads:
    enabled: true
    type: nfs
    server: 172.16.250.191
    path: /var/nfs/shared/Media
    advancedMounts:
      main:
        prowlarr:
          - path: /downloads
