controllers:
  flaresolverr:
    replicas: 1
    containers:
      app:
        image:
          repository: ghcr.io/flaresolverr/flaresolverr
          tag: v3.5.2
        env:
          TZ: "Europe/London"
          LOG_LEVEL: "info"
          CAPTCHA_SOLVER: "none"   # or 'hcaptcha-solver' if you add support later
          PORT: "8191"
        # Each request starts its own Chromium under Xvfb. At 500m/512Mi a plain ping took 85s
        # (tab crashes, script timeouts), past Prowlarr's 65s proxy timeout.
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 2Gi

service:
  app:
    controller: flaresolverr
    type: ClusterIP
    ports:
      http:
        port: 8191

# Don’t declare ingress at all unless you really want it.
# If you DO want it, uncomment and fill in hosts.
# ingress:
#   app:
#     enabled: true
#     className: "traefik"
#     hosts:
#       - host: flaresolverr.yourdomain.local
#         paths:
#           - path: /
#             service:
#               name: app
#               port: http

# app-template v3 is picky about persistence, so we just don't define any.
# Flaresolverr is stateless, so this is fine.
persistence: {}

# Probes: none. app-template 4 ships no default probes, so the container renders without any.