apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: configarr-secrets
  namespace: servarr
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: homelab
  target:
    name: configarr-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      type: Opaque
  # 1Password items: "servarr-api-keys" holds every arr's current key (Settings > General),
  # "nzbget" and "qbittorrent" the logins the arrs use for their download clients.
  # configarr/local.env lists the same references for running by hand.
  data:
    - secretKey: RADARR_API_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: servarr-api-keys
        property: RADARR_API_KEY
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: SONARR_API_KEY
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: servarr-api-keys
        property: SONARR_API_KEY
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: NZBGET_USERNAME
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: nzbget
        property: CONTROL_USERNAME
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: NZBGET_PASSWORD
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: nzbget
        property: CONTROL_PASSWORD
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: QBITTORRENT_USERNAME
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: qbittorrent
        property: WEBUI_USERNAME
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: QBITTORRENT_PASSWORD
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: qbittorrent
        property: WEBUI_PASSWORD
        metadataPolicy: None
        nullBytePolicy: Ignore
