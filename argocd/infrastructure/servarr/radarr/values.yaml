controllers:
  main:
    strategy: Recreate
    replicas: 1
    pod:
      securityContext:
        fsGroup: 988
        fsGroupChangePolicy: OnRootMismatch
    containers:
      radarr:
        image:
          repository: ghcr.io/linuxserver/radarr
          tag: 6.4.4
        env:
          TZ: Europe/London
          PUID: "1000"
          PGID: "988"
          # config.xml settings; env wins over the file and over UI edits. Restart to apply.
          # RADARR__AUTH__APIKEY comes from envFrom below.
          RADARR__AUTH__METHOD: Forms           # exact case, or it silently falls back to the file
          RADARR__AUTH__REQUIRED: Enabled
          RADARR__SERVER__PORT: "8989"          # not Radarr's default 7878; Service, probes and clients use 8989
          RADARR__LOG__LEVEL: info
          RADARR__LOG__ANALYTICSENABLED: "False"
          RADARR__UPDATE__MECHANISM: Docker
          RADARR__UPDATE__AUTOMATICALLY: "False"
          RADARR__UPDATE__BRANCH: master
        # optional: if the secret is missing, Radarr starts with the key already in config.xml
        envFrom:
          - secretRef: { name: radarr-secrets, optional: true }
        probes:
          liveness:  { enabled: true,  type: TCP, port: 8989 }
          readiness: { enabled: true,  type: TCP, port: 8989 }

service:
  web:
    controller: main
    type: ClusterIP
    ports:
      http:
        port: 8989
        targetPort: 8989

ingress:
  web:
    enabled: true
    className: traefik-internal
    hosts:
      - host: radarr.gregpakes.co.uk
        paths:
          - path: /
            service:
              identifier: web
              port: http
    # tls: []  # add if you want certs now

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: radarr-config
    advancedMounts:
      main:
        radarr:
          - path: /config

  downloads:
    enabled: true
    type: nfs
    server: 172.16.250.191
    path: /var/nfs/shared/Media
    advancedMounts:
      main:
        radarr:
          - path: /downloads
