controllers:
  main:
    strategy: Recreate
    replicas: 1
    pod:
      securityContext:
        fsGroup: 988
        fsGroupChangePolicy: OnRootMismatch
    containers:
      sonarr:
        image:
          repository: ghcr.io/linuxserver/sonarr
          tag: 4.0.20
        env:
          TZ: Europe/London
          PUID: "1000"
          PGID: "988"
          # config.xml settings; env wins over the file and over UI edits. Restart to apply.
          # SONARR__AUTH__APIKEY comes from envFrom below.
          SONARR__AUTH__METHOD: Forms           # exact case, or it silently falls back to the file
          SONARR__AUTH__REQUIRED: Enabled
          SONARR__SERVER__PORT: "8989"
          SONARR__LOG__LEVEL: info
          SONARR__LOG__ANALYTICSENABLED: "False"
          SONARR__UPDATE__MECHANISM: Docker
          SONARR__UPDATE__AUTOMATICALLY: "False"
          SONARR__UPDATE__BRANCH: main
        # optional: if the secret is missing, Sonarr starts with the key already in config.xml
        envFrom:
          - secretRef: { name: sonarr-secrets, optional: true }
        probes:
          liveness:  { enabled: true,  type: TCP, port: 8989 }
          readiness: { enabled: true,  type: TCP, port: 8989 }

service:
  web:
    controller: main
    type: ClusterIP
    ports:
      http:
        port: 8989
        targetPort: 8989

ingress:
  web:
    enabled: true
    className: traefik-internal
    hosts:
      - host: sonarr.gregpakes.co.uk
        paths:
          - path: /
            service:
              identifier: web
              port: http
    # tls: []  # add if you want certs now

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: sonarr-config
    advancedMounts:
      main:
        sonarr:
          - path: /config

  downloads:
    enabled: true
    type: nfs
    server: 172.16.250.191
    path: /var/nfs/shared/Media
    advancedMounts:
      main:
        sonarr:
          - path: /downloads
