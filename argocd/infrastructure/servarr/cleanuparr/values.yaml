# Cleanuparr keeps all cleaner settings in its own database under /config; env vars only
# cover port/bind/base path/IDs/DB, so these are set in the UI and recorded here.
#
# Queue Cleaner (set 2026-10-21), runs hourly:
#   Failed Import: max strikes 5, pattern mode Include
#     Included patterns:
#       No files found are eligible for import
#       Not a Custom Format upgrade
#       Not an upgrade
#       contains more episodes than this file contains
#       title mismatch
#       not found in the grabbed release
#       was unexpected considering
#       Unable to parse
#       Couldn't find similar album       (Lidarr, added 2026-10-21)
#       Album match is not close enough   (Lidarr, added 2026-10-21)
#       Has missing tracks                (Lidarr, added 2026-10-21)
#       Found executable file             (added 2026-10-21)
#       Found archive file                (added 2026-10-21)
#     Lidarr never retries an album whose import failed; removing the download with a
#     blocklist makes it search for another release, so these three keep Home Assistant's
#     music requests flowing without a manual import. "Couldn't find similar album" is
#     mostly whole-album image rips (one .wv/.ape file plus a cue), which Lidarr can't split.
#     "Found executable file" is the arrs' warning for a download with an .exe in it. Fake
#     usenet albums are just an .exe and a .zip, and the Malware Blocker can't see NZBGet,
#     so this pattern is what clears them.
#     "Found archive file" only clears archives Unpackerr can't extract, such as a
#     password-protected fake that the Sonarr/Radarr blocklist now lets download in full.
#     Unpackerr extracts a good set within minutes and the arr imports it, long before the
#     fifth hourly strike.
#     Skip if Not Found in Client: off. qBittorrent is the only client Cleanuparr supports here
#       (no NZBGet), so with this on every usenet download skipped the check.
#     Force Import: on, max tries 3 (imports "matched to series/movie by ID" blocks)
#     Ignore Private / Delete Private from Client: off, so private torrents keep seeding
#   Downloading Metadata: max strikes 3 (was 0 and left a magnet stuck for a month)
#   Errored Downloads: max strikes 0
#   Stalled and Slow rules: one each, 3 strikes
#
# Malware Blocker (read 2026-10-21), runs hourly. It reads torrent file lists, so it only
# covers qBittorrent, never NZBGet:
#   Delete Private from Client on. Ignore Private, no-content-ID and "Delete if any file is
#   blocked" off, so a torrent is removed only when every file in it is blocked; otherwise
#   the blocked files are set to skip in qBittorrent.
#   Sonarr, Radarr: Blacklist /blocklists/sonarr-radarr-blacklist.txt (blocklists-configmap.yaml)
#     Cleanuparr's default list without the archive types Unpackerr extracts. The upstream
#     list blocks .rar, .r00-.r04, .zip and .7z, so a scene rar torrent lost its first
#     volumes before Unpackerr saw it (suspected for Star Wars II, 2026-10-21).
#   Lidarr: Whitelist /blocklists/lidarr-whitelist.txt (blocklists-configmap.yaml)
#   Readarr, Whisparr, Sportarr, LazyLibrarian: off
controllers:
  main:
    strategy: Recreate
    pod:
      securityContext:
        fsGroup: 988
        fsGroupChangePolicy: OnRootMismatch
    replicas: 1
    containers:
      cleanuparr:
        image:
          repository: ghcr.io/cleanuparr/cleanuparr
          tag: 2.10.12
        env:
          TZ: Europe/London
          PUID: "1000"
          PGID: "988"
          UMASK: "002"
          PORT: "11011"
        probes:
          liveness:  { enabled: true, type: HTTP, path: /health, port: 11011 }
          readiness: { enabled: true, type: HTTP, path: /health, port: 11011 }
          startup:   { enabled: true, type: HTTP, path: /health, port: 11011 }
        # Must sit under the container; a top-level resources: key is silently ignored
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
service:
  main:
    controller: main
    ports:
      http:
        port: 11011
        targetPort: 11011
        protocol: TCP

ingress:
  main:
    enabled: true
    className: traefik-internal
    hosts:
      - host: cleanuparr.gregpakes.co.uk
        paths:
          - path: /
            service:
              identifier: main
              port: http
    # tls:   # optional if your wildcard cert already covers it

persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: cleanuparr-config

  # Malware Blocker lists from git (blocklists-configmap.yaml). A directory mount, not
  # subPath, so ConfigMap edits reach the pod without a restart.
  blocklists:
    enabled: true
    type: configMap
    name: cleanuparr-blocklists
    globalMounts:
      - path: /blocklists
        readOnly: true