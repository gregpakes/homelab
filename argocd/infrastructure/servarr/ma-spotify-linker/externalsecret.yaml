apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ma-spotify-linker-secrets
  namespace: servarr
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: homelab
  target:
    name: ma-spotify-linker-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      type: Opaque
  # 1Password item "ma-spotify-linker": musicassistant-api-token is a long-lived token of a
  # Music Assistant admin user (Settings > Profile > Long-lived access tokens) (the job calls music/match_providers, which needs library-manage scope).
  # Long-lived tokens expire after a year.
  data:
    - secretKey: MA_TOKEN
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: ma-spotify-linker
        property: musicassistant-api-token
        metadataPolicy: None
        nullBytePolicy: Ignore
