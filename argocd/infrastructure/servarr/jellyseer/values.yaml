# Seerr keeps its settings in /app/config/settings.json and has no env or file
# overrides for them, so they are set in the UI and recorded here (read 2026-10-21).
#
# Media server: Plex at https://plex.gregpakes.co.uk (443, TLS). Libraries: Movies,
#   Movies - Kids, TV, TV - Kids. Plex and local logins are both allowed; new users
#   get the Request permission only.
# Radarr (default, not 4K): radarr.servarr.svc.cluster.local:8989, root
#   /downloads/media/movies, minimum availability Released, no tags, sync off.
# Sonarr (default, not 4K): sonarr.servarr.svc.cluster.local:8989, root
#   /downloads/media/tv, season folders off, no tags, sync off.
#   Both store quality profile 1 ("Any") as their default. Radarr's Any accepts CAM and
#   telesync, and Sonarr has no profile 1 at all. Requests so far went out with
#   2160p Quality (9) or 1080p Quality (12) chosen per request; pick a real default in
#   Settings > Services before relying on it.
#   Each server holds its arr's API key (the same keys as servarr-api-keys).
# Notifications: Pushover for everything except test and auto-requested, and ntfy for
#   media available. Their tokens and URLs live only in settings.json.
# General: streaming region GB, partial season requests on, special episodes off.
controllers:
  main:
    strategy: Recreate
    replicas: 1
    pod:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    # init container creates config dir
    initContainers:
      perms:
        image:
          repository: alpine
          tag: "3.24"
        command: ["/bin/sh","-c"]
        args:
          - |
            mkdir -p /app/config/logs &&
            chown -R 1000:1000 /app/config &&
            chmod -R u+rwX,g+rwX /app/config
        securityContext:
          runAsUser: 0
          runAsGroup: 0

    containers:
      jellyseerr:
        image:
          repository: ghcr.io/seerr-team/seerr
          tag: v3.5.1
        env:
          TZ: Europe/London
          # If you want to force non-root:
          # (Upstream defaults work fine; uncomment if you need it for NFS)
          # PUID: "1000"
          # PGID: "1000"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
        # TCP probes are simple & robust here
        probes:
          readiness:
            enabled: true
            type: TCP
            port: 5055
          liveness:
            enabled: true
            type: TCP
            port: 5055

service:
  web:
    controller: main
    type: ClusterIP
    ports:
      http:
        port: 5055
        targetPort: 5055
        protocol: TCP

ingress:
  web:
    enabled: true
    className: traefik-internal
    hosts:
      - host: jellyseerr.gregpakes.co.uk
        paths:
          - path: /
            service:
              identifier: web
              port: http
    # Uncomment if you have certs set up with cert-manager/Traefik
    # tls:
    #   - hosts: [jellyseerr.gregpakes.co.uk]
    #     secretName: jellyseerr-tls

persistence:
  config:
    enabled: true
    existingClaim: jellyseerr-config
    type: persistentVolumeClaim
    globalMounts:
      - path: /app/config

