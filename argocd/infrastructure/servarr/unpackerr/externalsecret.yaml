apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unpackerr-secrets
  namespace: servarr
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: homelab
  target:
    name: unpackerr-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  # 1Password item "servarr-api-keys" holds every arr's current key (Settings > General)
  data:
    - secretKey: RADARR_API_KEY
      remoteRef:
        key: servarr-api-keys
        property: RADARR_API_KEY
        nullBytePolicy: Ignore
    - secretKey: SONARR_API_KEY
      remoteRef:
        key: servarr-api-keys
        property: SONARR_API_KEY
        nullBytePolicy: Ignore
    - secretKey: LIDARR_API_KEY
      remoteRef:
        key: servarr-api-keys
        property: LIDARR_API_KEY
        nullBytePolicy: Ignore
