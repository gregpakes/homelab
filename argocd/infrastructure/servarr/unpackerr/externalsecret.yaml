apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unpackerr-secrets
  namespace: servarr
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: homelab
  target:
    name: unpackerr-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  # 1Password item "unpackerr-secrets", keys copied from Settings > General in each app
  data:
    - secretKey: RADARR_API_KEY
      remoteRef:
        key: unpackerr-secrets
        property: RADARR_API_KEY
        nullBytePolicy: Ignore
    - secretKey: SONARR_API_KEY
      remoteRef:
        key: unpackerr-secrets
        property: SONARR_API_KEY
        nullBytePolicy: Ignore
