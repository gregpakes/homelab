# Keep CRDs managed by the chart
crds:
  enabled: true
  keep: true

# Prometheus (Operator) config
prometheus:
  enabled: true
  prometheusSpec:
    retention: 15d
    scrapeInterval: 30s
    enableAdminAPI: true

    # Persist TSDB on Longhorn with Retain
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 75Gi

    # Scrape ANY ServiceMonitor/PodMonitor in ANY namespace
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    ruleSelector: {}
    ruleNamespaceSelector: {}
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

# Alertmanager (optional persistence)
alertmanager:
  enabled: true
  alertmanagerSpec:
    secrets:
      - alert-manager-pushover
  
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: pushover
    receivers:
      - name: "null"
      
      - name: pushover
        pushover_configs:
          - user_key_file: /etc/alertmanager/secrets/alert-manager-pushover/user_key
            token_file: /etc/alertmanager/secrets/alert-manager-pushover/token
            # Templates live in templateFiles below. Without an explicit
            # priority Alertmanager sends every firing alert as emergency (2),
            # which repeats every minute until acknowledged.
            title: '{{ template "pushover.homelab.title" . }}'
            message: '{{ template "pushover.homelab.message" . }}'
            priority: '{{ template "pushover.homelab.priority" . }}'
            url: '{{ template "pushover.homelab.url" . }}'
            url_title: Runbook
            html: true

  # Mounted at /etc/alertmanager/config/, which the chart's default
  # `templates:` glob already loads. Test locally with
  # `amtool template render --template.glob=... --template.data=...`.
  templateFiles:
    pushover.tmpl: |-
      {{/* Pushover title: status, alert name (or count when the group mixes alerts), namespace. */}}
      {{ define "pushover.homelab.title" -}}
      {{ $alerts := .Alerts.Firing }}{{ if eq .Status "resolved" }}{{ $alerts = .Alerts.Resolved }}{{ end -}}
      {{ if eq .Status "firing" }}FIRING{{ else }}RESOLVED{{ end }}:
      {{- if .CommonLabels.alertname }} {{ .CommonLabels.alertname }}{{ if gt (len $alerts) 1 }} ×{{ len $alerts }}{{ end }}
      {{- else }} {{ len $alerts }} alerts{{ end }}
      {{- with .GroupLabels.namespace }} · {{ . }}{{ end }}
      {{- end }}

      {{/* One alert: bold name and severity, the rule's description (it names the
           pod/node/instance), and when it started. Rules add "on cluster <label>",
           which is empty here, so drop it. */}}
      {{ define "pushover.homelab.alert" -}}
      <b>{{ .Labels.alertname }}</b>{{ with .Labels.severity }} ({{ . }}){{ end }}
      {{ with .Annotations.description }}{{ reReplaceAll ` on cluster (\.|$)` "$1" . | trimSpace }}{{ else }}{{ .Annotations.summary }}{{ end }}
      Since {{ .StartsAt | tz "Europe/London" | date "Mon 2 Jan 15:04" }}
      {{- if eq .Status "resolved" }}, resolved {{ .EndsAt | tz "Europe/London" | date "Mon 2 Jan 15:04" }}{{ end }}
      {{- end }}

      {{/* Alertmanager cuts Pushover messages at 1024 characters, so list at most five alerts. */}}
      {{ define "pushover.homelab.message" -}}
      {{ range $i, $a := .Alerts.Firing }}{{ if lt $i 5 }}{{ if $i }}

      {{ end }}{{ template "pushover.homelab.alert" $a }}{{ end }}{{ end }}
      {{- if gt (len .Alerts.Firing) 5 }}

      …and more: {{ len .Alerts.Firing }} firing in total.{{ end }}
      {{- if and .Alerts.Firing .Alerts.Resolved }}

      <b>Resolved:</b>{{ range .Alerts.Resolved }} {{ .Labels.alertname }}{{ end }}
      {{- else if .Alerts.Resolved }}
      {{- range $i, $a := .Alerts.Resolved }}{{ if lt $i 5 }}{{ if $i }}

      {{ end }}{{ template "pushover.homelab.alert" $a }}{{ end }}{{ end }}
      {{- end }}
      {{- end }}

      {{/* Critical alerts go out at high priority (bypasses quiet hours), anything
           else firing at normal priority, and resolved notifications silently. */}}
      {{ define "pushover.homelab.priority" -}}
      {{ $p := "-1" }}
      {{- if eq .Status "firing" }}{{ $p = "0" }}
      {{- range .Alerts.Firing }}{{ if eq .Labels.severity "critical" }}{{ $p = "1" }}{{ end }}{{ end }}
      {{- end }}
      {{- $p }}
      {{- end }}

      {{/* Link the runbook of the first firing alert, when the rule has one. */}}
      {{ define "pushover.homelab.url" -}}
      {{ with .Alerts.Firing }}{{ with (index . 0).Annotations.runbook_url }}{{ . }}{{ end }}{{ end }}
      {{- end }}

# Grafana
grafana:
  enabled: true
  adminUser: admin
  adminPassword: "changeme"  # (recommend moving to External Secrets later)
  prune: true
  additionalDataSources:
    - name: Loki
      orgId: 1
      type: loki
      uid: loki
      access: proxy
      url: http://loki-gateway.monitoring.svc.cluster.local
      isDefault: false
      editable: true
      version: 2
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 10Gi
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: "ALL"   # pick up Rancher/other namespaces too
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
      label: grafana_datasource
      labelValue: "1"
      searchNamespace: "ALL"
      initDatasources: true
      restartPolicy: Always
  grafana.ini:
    server:
      # If you publish Grafana under a subpath in Rancher, use e.g. https://rancher.example/grafana and set serve_from_sub_path: true
      root_url: https://grafana.gregpakes.co.uk
      serve_from_sub_path: false
    security:
      cookie_samesite: none
      cookie_secure: true
  ingress:
    enabled: true
    ingressClassName: traefik-internal
    hosts:
      - grafana.gregpakes.co.uk
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # no tls section as traefik will use the default cert

# K3s specifics — keep etcd off unless you wire certs/endpoint
kubeEtcd:
  enabled: true
  endpoints:
    - 172.16.51.201
    - 172.16.51.202
    - 172.16.51.203
  service:
    enabled: true
    port: 2381
    targetPort: 2381

kubeControllerManager:
  enabled: false
  endpoints:
    - 172.16.51.201
    - 172.16.51.202
    - 172.16.51.203
kubeScheduler:
  enabled: false # not needed in k3s
kubeApiServer:
  enabled: false
kubeProxy:
  enabled: false
