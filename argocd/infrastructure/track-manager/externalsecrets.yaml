# Every credential this app uses, from 1Password via the `homelab` store.
#
# One 1Password item in the Homelab vault holds all of them:
#
#   item:  lapsmith-track-manager
#   fields:
#     github-token              fine-grained PAT, gregpakes/LapSmith only:
#                               Actions read+write, Contents read,
#                               Variables read, Environments read
#                               (Metadata read is implied)
#     firebase-service-account  the service-account key JSON, pasted whole
#     proxy-secret              `openssl rand -hex 32`
#     oauth-client-id           GitHub OAuth App client ID
#     oauth-client-secret       GitHub OAuth App client secret
#     cookie-secret             `openssl rand -base64 32 | tr -- '+/' '-_'`
#
# The registry pull reuses the existing `github-ghcr-pull` item (see
# argocd/infrastructure/arc-runners/shared/ghcr-pull-externalsecret.yaml): the
# Track Manager image is private for the same reason the runner image is.
#
# They are split into four Kubernetes Secrets so each pod mounts only what it
# needs: oauth2-proxy never sees the GitHub token or the Firebase key, and
# Track Manager never sees the OAuth client or the cookie secret. The proxy
# secret is the one value both hold — oauth2-proxy sends it, Track Manager
# checks it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: track-manager-ghcr-pull
  namespace: track-manager
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: homelab
  target:
    name: track-manager-ghcr-pull
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "ghcr.io": {
                "auth": "{{ printf "%s:%s" .username .token | b64enc }}"
              }
            }
          }
  data:
    - secretKey: username
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: github-ghcr-pull
        property: username
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: token
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: github-ghcr-pull
        property: token
        metadataPolicy: None
        nullBytePolicy: Ignore
---
# The value oauth2-proxy adds to every authenticated ForwardAuth response and
# Track Manager requires on every request. It is what makes the user header
# trustworthy: anything else that can reach the Track Manager pod could set
# that header itself, but not this. Never put it in a Traefik `headers`
# middleware — those take literal values, which would put it in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: track-manager-proxy
  namespace: track-manager
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: homelab
  target:
    name: track-manager-proxy
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: secret
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: lapsmith-track-manager
        property: proxy-secret
        metadataPolicy: None
        nullBytePolicy: Ignore
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: track-manager-credentials
  namespace: track-manager
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: homelab
  target:
    name: track-manager-credentials
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: github-token
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: lapsmith-track-manager
        property: github-token
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: firebase-service-account.json
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: lapsmith-track-manager
        property: firebase-service-account
        metadataPolicy: None
        nullBytePolicy: Ignore
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: track-manager-oauth2-proxy
  namespace: track-manager
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: homelab
  target:
    name: track-manager-oauth2-proxy
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: client-id
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: lapsmith-track-manager
        property: oauth-client-id
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: client-secret
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: lapsmith-track-manager
        property: oauth-client-secret
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: cookie-secret
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: lapsmith-track-manager
        property: cookie-secret
        metadataPolicy: None
        nullBytePolicy: Ignore
