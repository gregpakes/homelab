# The hosted Track Manager's catalog draft (TRACK_CATALOG_DRAFT_DIR=/data):
# curation edits between saves, until Publish turns them into a pull request on
# gregpakes/LapSmith. main on GitHub stays the source of truth, so this holds
# only unpublished work — a few MB.
#
# ReadWriteOnce matches the Deployment: one replica, Recreate, so the old pod
# releases the volume before the new one mounts it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: track-manager-draft
  namespace: track-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn
