# The hosted Track Manager's catalog draft (TRACK_CATALOG_DRAFT_DIR=/data):
# curation edits between saves, until Publish turns them into a pull request on
# gregpakes/LapSmith. main on GitHub stays the source of truth, so this holds
# only unpublished work — a few MB.
#
# ReadWriteOnce matches the Deployment: one replica, Recreate, so the old pod
# releases the volume before the new one mounts it.
#
# SAME SYNC WAVE AS THE DEPLOYMENT ("5"), never earlier. The longhorn storage
# class binds WaitForFirstConsumer: the claim stays Pending until a pod using
# it is scheduled. Argo treats a Pending claim as not yet healthy and will not
# start a later wave until it is, so an earlier wave here deadlocks — the claim
# waits for the pod, Argo waits for the claim. Within one wave Argo applies
# the claim before the Deployment and then waits for both.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: track-manager-draft
  namespace: track-manager
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn
