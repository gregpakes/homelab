apiVersion: v1
kind: ConfigMap
metadata:
  name: arc-runner-hooks
  namespace: arc-runners
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  # Runs inside the runner container before every job, via
  # ACTIONS_RUNNER_HOOK_JOB_STARTED.
  #
  # Why this exists: ghcr.io/actions/actions-runner is a minimal Ubuntu 24.04
  # image, not the fat GitHub-hosted ubuntu-latest image. It does ship
  # passwordless sudo and apt, but a handful of things the workflows assume are
  # simply absent. The load-bearing one is xz-utils: subosito/flutter-action
  # fetches the Linux Flutter SDK as .tar.xz, and tar cannot decompress it
  # without the xz binary — every Flutter job fails at setup without this.
  #
  # Toolchains proper (Flutter, Java, Node, Dart, Ruby, the Android SDK) stay in
  # the workflows via their setup actions, so the workflows remain runnable on
  # GitHub-hosted runners unchanged. What belongs here is only the environment
  # those actions assume already exists: base OS packages, and a writable tool
  # cache for them to extract into.
  job-started.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    # --- 1. Runner tool cache -------------------------------------------------
    #
    # EVERY setup action writes here: ruby/setup-ruby, actions/setup-node,
    # actions/setup-java, dart-lang/setup-dart and subosito/flutter-action all
    # extract into the runner tool cache. GitHub-hosted images ship
    # /opt/hostedtoolcache already owned by the runner user. This image has no
    # such directory at all, /opt is root-owned 0755, and the runner sets no
    # RUNNER_TOOL_CACHE, so the actions fail on their first write with:
    #
    #   Error: EACCES: permission denied, mkdir '/opt/hostedtoolcache'
    #
    # The path is hardcoded deliberately, and must NOT be derived from
    # RUNNER_TOOL_CACHE. The runner does set RUNNER_TOOL_CACHE to a writable
    # location of its own, which is why actions/setup-node, setup-java and
    # dart-lang/setup-dart all work here without help. ruby/setup-ruby is the
    # exception: it ignores that variable and goes straight to the literal
    # /opt/hostedtoolcache, as its own log shows when it puts
    # /opt/hostedtoolcache/Ruby/<v>/x64/bin on PATH before dying.
    #
    # An earlier version of this hook guarded on
    # `[[ ! -w "${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}" ]]`, which silently
    # did nothing: RUNNER_TOOL_CACHE was set and writable, so the test was false
    # and the directory Ruby actually needs was never created. Worse, the skipped
    # branch printed nothing, so the hook output was indistinguishable from the
    # version that had no tool-cache handling at all. Keep this unconditional.
    HOSTED_TOOL_CACHE=/opt/hostedtoolcache
    if [[ ! -d "$HOSTED_TOOL_CACHE" || ! -w "$HOSTED_TOOL_CACHE" ]]; then
      echo "runner-hook: preparing $HOSTED_TOOL_CACHE (RUNNER_TOOL_CACHE=${RUNNER_TOOL_CACHE:-unset})"
      sudo mkdir -p "$HOSTED_TOOL_CACHE"
      sudo chown "$(id -u):$(id -g)" "$HOSTED_TOOL_CACHE"
    else
      echo "runner-hook: $HOSTED_TOOL_CACHE already writable"
    fi

    # --- 2. Base OS packages --------------------------------------------------
    PKGS=(xz-utils zip wget file)

    missing=()
    for p in "${PKGS[@]}"; do
      dpkg -s "$p" >/dev/null 2>&1 || missing+=("$p")
    done

    if ((${#missing[@]})); then
      echo "runner-hook: installing ${missing[*]}"
      sudo apt-get update -qq
      sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
        --no-install-recommends "${missing[@]}"
    else
      echo "runner-hook: base packages already present"
    fi

    echo "runner-hook: done"
