apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-github-app
  namespace: arc-runners
  annotations:
    argocd.argoproj.io/sync-wave: "0"
#
# Source of truth is a 1Password item in the Homelab vault:
#
#   item:  github-actions-runner
#   fields:
#     app-id           the GitHub App's App ID (numeric)
#     installation-id  the installation ID, from the App's install URL on the repo
#     private-key      the full contents of the generated .pem, BEGIN/END lines included
#
# The App is installed on gregpakes/LapSmith only, and because the runner scale
# sets register at the REPOSITORY scope it needs exactly these permissions:
#
#   Repository -> Administration   Read and write
#   Repository -> Metadata         Read-only
#
# Administration write is what allows a runner to register itself; it is only
# needed for repository-scope registration. If these ever move to org scope the
# permission changes to "Self-hosted runners: Read and write" instead.
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: homelab
  target:
    # Consumed by both runner scale sets as a pre-defined secret
    # (githubConfigSecret: arc-github-app). The three key names below are fixed
    # by ARC — do not rename them.
    name: arc-github-app
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      type: Opaque
  # The four *Strategy/*Policy fields below are CRD defaults and look like noise.
  # They are load-bearing for Argo: the API server writes them on admission, so a
  # manifest that omits them can never match the live object and the Application
  # sits permanently OutOfSync. This is the same reason the openclaw
  # ExternalSecret in this repo spells them out — keep them.
  data:
    - secretKey: github_app_id
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: github-actions-runner
        property: app-id
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: github_app_installation_id
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: github-actions-runner
        property: installation-id
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: github_app_private_key
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: github-actions-runner
        property: private-key
        metadataPolicy: None
        nullBytePolicy: Ignore
