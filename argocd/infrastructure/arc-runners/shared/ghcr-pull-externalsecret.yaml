apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  namespace: arc-runners
  annotations:
    # Wave 0 within the arc-runners-shared app (wave 24), so the secret exists
    # before the runner scale sets (wave 25) create pods that reference it.
    argocd.argoproj.io/sync-wave: "0"
#
# Lets runner pods pull the prebaked Android CI image from GitHub Container
# Registry. That package is private because gregpakes/LapSmith is private, and
# nothing else in this cluster has ever needed registry auth: every other ghcr.io
# image here (openclaw, termix, the servarr stack, patchmon) is a public package
# that pulls anonymously.
#
# Source of truth is a 1Password item in the Homelab vault:
#
#   item:  github-ghcr-pull
#   fields:
#     username  the GitHub username that owns the token
#     token     a CLASSIC personal access token with ONLY read:packages
#
# Use a classic token, not fine-grained: GHCR's registry endpoint does not
# reliably accept fine-grained tokens. read:packages alone is enough to pull and
# grants no repository access, so this credential cannot read source even if it
# leaks. It does not expire unless you set an expiry — if you do, note that pulls
# start failing on expiry with ImagePullBackOff, not with anything more obvious.
#
# Only the "auth" field is emitted below. A docker config entry needs either
# username+password or the base64 "user:token" pair, not both, so emitting one
# keeps the token in exactly one place in the rendered secret.
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: homelab
  target:
    name: ghcr-pull
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "ghcr.io": {
                "auth": "{{ printf "%s:%s" .username .token | b64enc }}"
              }
            }
          }
  data:
    - secretKey: username
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: github-ghcr-pull
        property: username
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: token
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: github-ghcr-pull
        property: token
        metadataPolicy: None
        nullBytePolicy: Ignore
