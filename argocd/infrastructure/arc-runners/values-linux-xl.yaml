## Disk-heavy Linux CI pool for gregpakes/LapSmith.
##
## Target with `runs-on: homelab-linux-xl`.
##
## This pool exists because the workers do not have comparable disk:
##
##   k3s-04   ~37 GB allocatable ephemeral storage
##   k3s-06   ~62 GB
##   k3s-05  ~531 GB
##
## The Android compile needs the Flutter SDK, the Android SDK + cmdline-tools,
## the pub cache and the Gradle caches all at once — comfortably over what
## k3s-04 can spare. Scheduling it anywhere but k3s-05 would reproduce the
## out-of-disk failure this whole setup is meant to fix, so it is pinned.

githubConfigUrl: https://github.com/gregpakes/LapSmith

githubConfigSecret: arc-github-app

runnerScaleSetName: homelab-linux-xl

# See the equivalent note in values-linux.yaml: mandatory under Argo CD, because
# the chart's live-lookup discovery of the controller ServiceAccount cannot work
# under `helm template`.
controllerServiceAccount:
  namespace: arc-systems
  name: arc-gha-rs-controller

minRunners: 0
# Two concurrent heavy builds. k3s-05 has 8 CPU with roughly 5 uncommitted, so
# this pool alone will not exhaust it, and the general pool can still land here.
maxRunners: 2

template:
  spec:
    # Pinned by hostname rather than a custom node label: node labels are not
    # managed by this repo, so a label would be undocumented cluster state that
    # someone has to remember to reapply. If k3s-05 is ever rebuilt or the big
    # disk moves, change it here.
    nodeSelector:
      kubernetes.io/hostname: k3s-05

    # Needed once `image` below points at the prebaked Android runner, which is a
    # private GHCR package (gregpakes/LapSmith is private). Harmless while the
    # image is still the public upstream one, and landing it first means flipping
    # the image tag is a one-line change that cannot fail on auth.
    # Provided by shared/ghcr-pull-externalsecret.yaml, which syncs in an earlier
    # wave than this scale set.
    imagePullSecrets:
      - name: ghcr-pull

    volumes:
      - name: work
        emptyDir:
          sizeLimit: 120Gi
      - name: runner-hooks
        configMap:
          name: arc-runner-hooks
          defaultMode: 0755

    containers:
      - name: runner
        # Prebaked image, NOT the stock upstream runner: it carries the Android
        # SDK, NDK 28.2.13676358, CMake 3.22.1, platforms 34/35/36 and
        # build-tools 35, which Gradle otherwise re-downloaded on every job
        # (~10 GB, ~16 min) because the runners are ephemeral.
        #
        # Built from .github/runner-image/Dockerfile in gregpakes/LapSmith and
        # published by its "CI runner image" workflow. The tag is a commit SHA and
        # is pinned by hand on purpose — an auto-updating tag would silently
        # change what CI runs on, and a bad runner image breaks every Android
        # build at once. To move it: rerun that workflow, take the tag from its
        # job summary, change it here.
        #
        # Private package, so this pool needs imagePullSecrets (above).
        # Keep this tag in step with values-linux.yaml: both images are built from
        # the same Dockerfile in the same workflow run, and the android target is
        # layered on the base one, so mixed tags mean mixed Flutter SDKs.
        image: ghcr.io/gregpakes/lapsmith-ci-runner-android:sha-7dc8cf2
        command: ["/home/runner/run.sh"]
        env:
          - name: ACTIONS_RUNNER_HOOK_JOB_STARTED
            value: /home/runner/hooks/job-started.sh
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: runner-hooks
            mountPath: /home/runner/hooks
        resources:
          # Measured on real Android builds, not derived from gradle.properties.
          # Sampling the full job lifecycle gave a peak of 5557m CPU and
          # 14600Mi (14.3 GiB) memory.
          requests:
            # Was 2 — a 3x understatement, which let the scheduler place other
            # work on top of a job that actually wants six cores.
            cpu: "6"
            memory: 12Gi
            ephemeral-storage: 40Gi
          limits:
            # Was 6, and the build was clipping against it at 5557m.
            cpu: "10"
            # Was 16Gi against a measured 14.3 GiB peak — only 9% headroom. An
            # OOM-killed Gradle worker is also the best explanation available for
            # the old "Gradle build failed to produce an .apk file" failure,
            # which produced no Gradle error, no APK, and orphaned java
            # processes at cleanup. Unproven retroactively, but this removes the
            # cliff either way.
            memory: 20Gi
            ephemeral-storage: 130Gi
