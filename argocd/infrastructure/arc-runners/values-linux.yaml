## General-purpose Linux CI pool for gregpakes/LapSmith.
##
## Target with `runs-on: homelab-linux`.
##
## Sized for the light-to-medium jobs: flutter analyze, the sharded flutter test
## suite, the shared-package tests, the Node guard scripts, and the desktop
## analyze/test job. Anything that needs a lot of disk (the Android compile)
## belongs on the homelab-linux-xl pool instead — see values-linux-xl.yaml.

githubConfigUrl: https://github.com/gregpakes/LapSmith

# Pre-defined secret (Variation C), populated by external-secrets from the
# 1Password Homelab vault. See shared/externalsecret.yaml.
githubConfigSecret: arc-github-app

runnerScaleSetName: homelab-linux

# Required, not optional, when installing via Argo CD. The chart otherwise tries
# to *discover* the controller's ServiceAccount with a live cluster lookup
# (app.kubernetes.io/part-of=gha-rs-controller). Argo renders with
# `helm template`, where lookups return nothing, so the chart fails outright with
# "No gha-rs-controller deployment found". Must match the controller's release
# name (arc) and namespace in argocd/apps/arc-controller.yaml.
controllerServiceAccount:
  namespace: arc-systems
  name: arc-gha-rs-controller

# Scale to zero when CI is idle: these pods exist only for the life of one job.
minRunners: 0
maxRunners: 6

template:
  spec:
    # All three workers. Masters are excluded because they are 4 CPU / 6 GB with
    # ~12 GB of disk and also run etcd — a Flutter build there would hurt.
    nodeSelector:
      worker: "true"

    # ARC does no placement of its own: it creates N runner pods and leaves them
    # to kube-scheduler, which scores by *requests* and prefers the
    # least-allocated node. Because a runner requests 1 CPU but may use 4, the
    # scheduler thinks it is placing something small and stacks 6-7 Flutter
    # builds onto whichever node currently looks emptiest — observed live, with
    # all three general runners on k3s-06 while k3s-04 and k3s-05 idled.
    #
    # That both wastes two thirds of the cluster and creates the CPU contention
    # that makes timing-sensitive tests flaky (obd_adapter_controller_rate_test
    # measures a rate and fails just over its threshold under load).
    #
    # ScheduleAnyway, not DoNotSchedule: a hard constraint would leave pods
    # Pending when a node is full, and ARC counts a Pending pod as already
    # provisioned, so jobs would stall rather than queue visibly.
    #
    # Scoped to this scale set's instance label so the -xl pool, which is pinned
    # to a single node by nodeSelector, is not counted in the skew.
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/instance: homelab-linux
            app.kubernetes.io/component: runner

    # Required now that `image` below is a private GHCR package. Without it every
    # job on this pool fails at ImagePullBackOff, not just some.
    # Provided by shared/ghcr-pull-externalsecret.yaml, which syncs in an earlier
    # wave than this scale set.
    imagePullSecrets:
      - name: ghcr-pull

    # Ephemeral runners: a job's workspace never needs to outlive the pod, so an
    # emptyDir is both correct and the fastest option (node-local disk, no
    # Longhorn replication in the build path).
    volumes:
      - name: work
        emptyDir:
          sizeLimit: 30Gi
      - name: runner-hooks
        configMap:
          name: arc-runner-hooks
          defaultMode: 0755

    containers:
      - name: runner
        # Prebaked image, not the stock upstream runner. Carries the Flutter SDK
        # (matching the flutter-version pin in test.yml), ffmpeg, and the base OS
        # packages, because these runners are ephemeral — one pod per job — so
        # anything downloaded is thrown away.
        #
        # Measured motivation: subosito/flutter-action plus its cache-upload post
        # step were 2862s of 6220s total step time, i.e. 46% of all CI time. With
        # 9 Flutter jobs starting at once none of them can hit the Actions cache,
        # so all downloaded the SDK and all uploaded ~1.5 GB back over the same
        # uplink. test.yml now skips flutter-action on self-hosted runners and
        # uses the SDK baked in here.
        #
        # Built from .github/runner-image/Dockerfile (target: base) in
        # gregpakes/LapSmith. The tag is pinned by hand on purpose — an
        # auto-updating tag would silently change what CI runs on. To move it:
        # rerun that repo's "CI runner image" workflow and take the tag from its
        # job summary. Keep it in step with values-linux-xl.yaml; test.yml's
        # analyze job fails loudly if the baked Flutter drifts from its pin.
        image: ghcr.io/gregpakes/lapsmith-ci-runner:sha-a9be3ab
        command: ["/home/runner/run.sh"]
        env:
          # Now a no-op on this image (the packages and the tool cache are baked
          # in, so the hook detects them and exits) but kept deliberately: it is
          # what makes a fallback to the stock upstream runner image work without
          # any other change.
          - name: ACTIONS_RUNNER_HOOK_JOB_STARTED
            value: /home/runner/hooks/job-started.sh
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: runner-hooks
            mountPath: /home/runner/hooks
        resources:
          # Measured, not guessed. Sampling 24 runners through a full job
          # lifecycle gave a typical peak of ~1400-1700m CPU and a maximum of
          # 3797Mi memory — so the old 1 CPU / 2Gi request understated both, and
          # kube-scheduler (which scores on requests and is blind to actual load)
          # responded by stacking the whole pool onto whichever node looked
          # emptiest.
          requests:
            # 3, not 2, for a scheduling reason as much as a usage one: with ~13
            # CPU free per 16-core worker, a 2-CPU request still lets all six
            # runners fit on ONE node (6x2=12 <= 13) — the exact packing this is
            # meant to stop. At 3 the arithmetic caps it at four per node, and
            # the topology spread constraint above handles the rest.
            cpu: "3"
            memory: 4Gi
            # Reserved so the scheduler will not stack more runners onto a node
            # than its disk can hold. This is the guard against the original
            # failure mode (a build dying when the filesystem filled up).
            ephemeral-storage: 12Gi
          limits:
            # Raised from 4: in that same sample, 9 of 24 runners sat pinned at
            # exactly 4000-4005m, i.e. they were not using 4 cores, they were
            # being throttled at the ceiling. Real demand is higher than 4 and
            # the old limit hid how much. Still bursty by design — the Dart
            # frontend and Gradle spike hard and briefly.
            cpu: "6"
            memory: 8Gi
            ephemeral-storage: 35Gi
