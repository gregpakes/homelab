# The operator authenticates to the Tailscale control plane with an OAuth client,
# not an auth key - auth keys expire (90 days max) and would silently strand the
# operator, whereas an OAuth client does not.
#
# The chart only templates the operator-oauth Secret when oauth.clientId is set in
# values.yaml, which would put the client secret in git. values.yaml deliberately
# leaves that block empty, so the chart skips its own Secret and the Deployment
# mounts this one instead (secretName: operator-oauth, keys client_id and
# client_secret - both names are fixed by the chart, do not rename them).
#
# 1Password item required in the Homelab vault:
#   title:         tailscale-operator
#   field client_id / field client_secret
# Generate the pair at https://login.tailscale.com/admin/settings/oauth with the
# auth_keys scope and tag:k8s-operator - see README.md in this directory.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tailscale-operator-oauth
  namespace: tailscale
  annotations:
    # Ahead of the chart's own resources (wave 0). The operator crash-loops without
    # this Secret, so create it before the Deployment rather than after.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: homelab
  target:
    name: operator-oauth
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: tailscale-operator
        property: client_id
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: client_secret
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: tailscale-operator
        property: client_secret
        metadataPolicy: None
        nullBytePolicy: Ignore
