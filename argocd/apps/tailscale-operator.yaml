apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-operator
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale

  sources:
    # 1) Upstream Helm chart (Tailscale Kubernetes operator)
    - repoURL: https://pkgs.tailscale.com/helmcharts
      chart: tailscale-operator
      targetRevision: 1.102.4
      helm:
        valueFiles:
          - $values/argocd/infrastructure/tailscale/values.yaml

    # 2) This repo, for values.yaml plus the ExternalSecret and the Connector CR
    - repoURL: https://github.com/gregpakes/homelab
      targetRevision: main
      ref: values
      path: argocd/infrastructure/tailscale
      directory:
        recurse: true

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The tailscale.com CRDs are chart templates gated on installCRDs, not files
      # in a crds/ directory - upstream does that deliberately so the CRDs can be
      # upgraded, which Helm's crds/ mechanism will not do. They therefore arrive
      # in the same sync as connector.yaml, and on a first sync Argo dry-runs the
      # Connector before connectors.tailscale.com is established in the API server,
      # failing the whole sync. This skips the dry-run while the CRD is missing;
      # the sync-wave on connector.yaml orders the real apply after it exists.
      - SkipDryRunOnMissingResource=true
