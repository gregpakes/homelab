apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: configarr
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: servarr
  sources:

    # 1) The hourly CronJob
    - repoURL: https://bjw-s-labs.github.io/helm-charts/
      chart: app-template
      targetRevision: 4.6.2
      helm:
        valueFiles:
          - $values/argocd/infrastructure/servarr/configarr/values.yaml

    # 2) values.yaml and the ExternalSecret
    - repoURL: https://github.com/gregpakes/homelab
      targetRevision: main
      ref: values
      path: argocd/infrastructure/servarr/configarr
      directory:
        recurse: true

    # 3) Configarr's config and templates as ConfigMaps. They have no `kind`, so they
    #    live outside argocd/infrastructure (see configarr/README.md).
    - repoURL: https://github.com/gregpakes/homelab
      targetRevision: main
      path: configarr

  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      # The template ConfigMaps are too big for client-side apply's
      # last-applied-configuration annotation (256 KiB).
      - ServerSideApply=true
