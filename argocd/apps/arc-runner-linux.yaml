apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-runner-linux
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "25"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners

  sources:
    - repoURL: ghcr.io/actions/actions-runner-controller-charts
      chart: gha-runner-scale-set
      targetRevision: 0.14.2
      helm:
        # The Helm release name is what GitHub shows as the runner scale set,
        # and it must match runnerScaleSetName in the values file.
        releaseName: homelab-linux
        valueFiles:
          - $values/argocd/infrastructure/arc-runners/values-linux.yaml

    - repoURL: https://github.com/gregpakes/homelab
      targetRevision: main
      ref: values

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
