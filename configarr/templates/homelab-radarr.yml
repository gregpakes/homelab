media_naming_api:
  renameMovies: false
  replaceIllegalCharacters: true
  colonReplacementFormat: smart
  standardMovieFormat: '{Movie Title} ({Release Year}) {Quality Full}'
  movieFolderFormat: '{Movie Title} ({Release Year})'
media_management:
  autoUnmonitorPreviouslyDownloadedMovies: false
  recycleBin: ''
  recycleBinCleanupDays: 7
  # The Repack1-3 custom formats rank repacks, as TRaSH intends with this setting.
  # preferAndUpgrade grabbed a repack of a different release as a revision upgrade, and
  # the import then rejected it on custom format score: Coyote vs Acme was downloaded
  # four times in a day (2026-10-21).
  downloadPropersAndRepacks: doNotPrefer
  createEmptyMovieFolders: false
  deleteEmptyFolders: false
  fileDate: none
  rescanAfterRefresh: always
  autoRenameFolders: false
  pathsDefaultStatic: false
  setPermissionsLinux: false
  chmodFolder: '755'
  chownGroup: ''
  skipFreeSpaceCheckWhenImporting: false
  minimumFreeSpaceWhenImporting: 100
  copyUsingHardlinks: true
  useScriptImport: false
  scriptImportPath: ''
  importExtraFiles: false
  extraFileExtensions: srt
  enableMediaInfo: true
root_folders:
  - /downloads/media/movies
  - /downloads/media/kids-movies
delay_profiles:
  default:
    enableUsenet: true
    enableTorrent: true
    preferredProtocol: usenet
    usenetDelay: 0
    # Minutes. Without a delay, preferredProtocol is only a tie-break and the first
    # acceptable RSS release wins; TorrentLeech often beats usenet by about an hour.
    torrentDelay: 120
    bypassIfHighestQuality: true
    bypassIfAboveCustomFormatScore: false
    minimumCustomFormatScore: 0
    order: 2147483647
