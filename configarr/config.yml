# Configarr enforces what this file and templates/ declare, every hour (the
# configarr CronJob in argocd/infrastructure/servarr/configarr). Read README.md
# before editing. `!env` values come from the configarr-secrets Secret (1Password
# via External Secrets) in the cluster, or from local.env when run by hand.
localConfigTemplatesPath: /app/config/templates
telemetry: false

radarr:
  radarr:
    base_url: !env RADARR_URL
    api_key: !env RADARR_API_KEY
    # Custom formats, profiles, sizes, naming, media management, root folders, delay profile.
    include:
      - template: homelab-radarr
    # Deletions stay off until about two weeks of hourly runs have been clean (plan step 3f).
    delete_unmanaged_custom_formats:
      enabled: false
    delete_unmanaged_quality_profiles:
      enabled: false
    download_clients:
      # The arrs only ever return "********", so passwords are set when a client
      # is created and never compared or rewritten afterwards.
      update_password: false
      delete_unmanaged:
        enabled: false
      config:
        enable_completed_download_handling: true
        auto_redownload_failed: true
        auto_redownload_failed_from_interactive_search: true
        check_for_finished_download_interval: 1
        download_client_working_folders: _UNPACK_|_FAILED_
      data:
        - name: NZBGet
          type: Nzbget
          enable: true
          priority: 1
          remove_completed_downloads: true
          remove_failed_downloads: true
          fields:
            host: download-clients-nzbgetui.servarr.svc.cluster.local
            port: 6789
            use_ssl: false
            username: !env NZBGET_USERNAME
            password: !env NZBGET_PASSWORD
            movie_category: Movies
            recent_movie_priority: 0
            older_movie_priority: 0
            add_paused: false
        - name: qBittorrent
          type: QBittorrent
          enable: true
          priority: 5
          remove_completed_downloads: true
          remove_failed_downloads: true
          fields:
            host: download-clients-webui.servarr.svc.cluster.local
            port: 8080
            use_ssl: false
            username: !env QBITTORRENT_USERNAME
            password: !env QBITTORRENT_PASSWORD
            movie_category: radarr
            recent_movie_priority: 0
            older_movie_priority: 0
            initial_state: 0
            sequential_order: false
            first_and_last: false
            content_layout: 0

sonarr:
  sonarr:
    base_url: !env SONARR_URL
    api_key: !env SONARR_API_KEY
    include:
      - template: homelab-sonarr
    delete_unmanaged_custom_formats:
      enabled: false
    delete_unmanaged_quality_profiles:
      enabled: false
    download_clients:
      update_password: false
      delete_unmanaged:
        enabled: false
      config:
        enable_completed_download_handling: true
        auto_redownload_failed: true
        auto_redownload_failed_from_interactive_search: true
        download_client_working_folders: _UNPACK_|_FAILED_
      data:
        - name: NZBGet
          type: Nzbget
          enable: true
          priority: 1
          remove_completed_downloads: true
          remove_failed_downloads: true
          fields:
            host: download-clients-nzbgetui.servarr.svc.cluster.local
            port: 6789
            use_ssl: false
            username: !env NZBGET_USERNAME
            password: !env NZBGET_PASSWORD
            tv_category: Series
            recent_tv_priority: 0
            older_tv_priority: 0
            add_paused: false
        - name: qBittorrent
          type: QBittorrent
          enable: true
          priority: 5
          remove_completed_downloads: true
          remove_failed_downloads: true
          fields:
            host: download-clients-webui.servarr.svc.cluster.local
            port: 8080
            use_ssl: false
            username: !env QBITTORRENT_USERNAME
            password: !env QBITTORRENT_PASSWORD
            tv_category: tv-sonarr
            recent_tv_priority: 0
            older_tv_priority: 0
            initial_state: 0
            sequential_order: false
            first_and_last: false
            content_layout: 0

lidarr:
  lidarr:
    base_url: !env LIDARR_URL
    api_key: !env LIDARR_API_KEY
    # Lidarr's quality and metadata profiles stay in the UI. Everything below
    # matches the live values read on 2026-10-21, apart from the release profile
    # and the quality sizes, which were added from git.
    media_naming_api:
      renameTracks: true
      replaceIllegalCharacters: true
      colonReplacementFormat: 4
      standardTrackFormat: "{Album Title} ({Release Year})/{Artist Name} - {Album Title} - {track:00} - {Track Title}"
      multiDiscTrackFormat: "{Album Title} ({Release Year})/{Medium Format} {medium:00}/{Artist Name} - {Album Title} - {track:00} - {Track Title}"
      artistFolderFormat: "{Artist Name}"
      includeArtistName: false
      includeAlbumTitle: false
      includeQuality: false
      replaceSpaces: false
    media_management:
      autoUnmonitorPreviouslyDownloadedTracks: false
      recycleBin: ""
      recycleBinCleanupDays: 7
      downloadPropersAndRepacks: preferAndUpgrade
      createEmptyArtistFolders: false
      deleteEmptyFolders: false
      fileDate: none
      watchLibraryForChanges: true
      rescanAfterRefresh: always
      allowFingerprinting: newFiles
      setPermissionsLinux: false
      chmodFolder: "755"
      chownGroup: ""
      skipFreeSpaceCheckWhenImporting: false
      minimumFreeSpaceWhenImporting: 100
      copyUsingHardlinks: true
      enableMediaInfo: true
      useScriptImport: false
      scriptImportPath: ""
      importExtraFiles: false
      extraFileExtensions: srt
    # No maximum size for the lossy qualities the Any profile allows (lossless has
    # none already). Lidarr caps a release at max kbps x the longest release it knows,
    # and the 350 default rejected singles that bundle extra versions: KATSEYE's
    # "Gabriela" was 17.7 MB against a 16.2 MB cap (2026-10-22). Lidarr skips the check
    # when max is 0. Configarr can't declare the UI's "unlimited" (null), but it can
    # declare 0. Qualities that aren't listed keep their server sizes.
    quality_definition:
      qualities:
        - quality: MP3-VBR-V0
          min: 0
          preferred: 195
          max: 0
        - quality: AAC-VBR
          min: 0
          preferred: 195
          max: 0
        - quality: MP3-320
          min: 0
          preferred: 195
          max: 0
        - quality: OGG Vorbis Q9
          min: 0
          preferred: 195
          max: 0
        - quality: AAC-320
          min: 0
          preferred: 195
          max: 0
        - quality: OGG Vorbis Q10
          min: 0
          preferred: 295
          max: 0
    # Lidarr root folders carry defaults for newly added artists. A root folder
    # that isn't listed here is deleted.
    root_folders:
      - path: /downloads/media/music
        name: Music Library
        metadata_profile: Standard
        quality_profile: Any
        monitor: all
        monitor_new_album: all
    delay_profiles:
      default:
        enableUsenet: true
        enableTorrent: true
        preferredProtocol: usenet
        usenetDelay: 0
        torrentDelay: 0
        bypassIfHighestQuality: true
        bypassIfAboveCustomFormatScore: false
        minimumCustomFormatScore: 0
        order: 2147483647
    # The complete list: a release profile that isn't listed here is deleted. VLS is the
    # scene tag for a vinyl single, which Lidarr otherwise grabs for the album of the same
    # name (Michael Jackson's "Bad" single, 2026-10-21). Lidarr profiles have no name, so
    # Configarr matches on content, and any edit here is a delete and re-create.
    release_profiles:
      - enabled: true
        ignored:
          - '/\bVLS\b/i'
    download_clients:
      update_password: false
      delete_unmanaged:
        enabled: false
      config:
        enable_completed_download_handling: true
        auto_redownload_failed: true
        auto_redownload_failed_from_interactive_search: true
        download_client_working_folders: _UNPACK_|_FAILED_
      data:
        - name: NZBGet
          type: Nzbget
          enable: true
          priority: 1
          remove_completed_downloads: true
          remove_failed_downloads: true
          fields:
            host: download-clients-nzbgetui.servarr.svc.cluster.local
            port: 6789
            use_ssl: false
            username: !env NZBGET_USERNAME
            password: !env NZBGET_PASSWORD
            music_category: Music
            recent_music_priority: 0
            older_music_priority: 0
            add_paused: false
        # Priority 1 here and 5 in Radarr and Sonarr, as live. Priority only ranks
        # clients of the same protocol, and this is the only torrent client.
        - name: qBittorrent
          type: QBittorrent
          enable: true
          priority: 1
          remove_completed_downloads: true
          remove_failed_downloads: true
          fields:
            host: download-clients-webui.servarr.svc.cluster.local
            port: 8080
            use_ssl: false
            username: !env QBITTORRENT_USERNAME
            password: !env QBITTORRENT_PASSWORD
            music_category: lidarr
            recent_music_priority: 0
            older_music_priority: 0
            initial_state: 0
            sequential_order: false
            first_and_last: false
            content_layout: 0

prowlarr:
  prowlarr:
    base_url: !env PROWLARR_URL
    api_key: !env PROWLARR_API_KEY
    # Configarr compares only the fields listed, but a rewrite starts from the
    # definition's defaults, so every field with a value is listed. The info_*
    # fields are the definitions' own help text and are left out.
    tags: [flaresolverr]
    sync_profiles:
      data:
        - name: Standard
          enable_rss: true
          enable_automatic_search: true
          enable_interactive_search: true
          minimum_seeders: 1
    indexer_proxies:
      data:
        # Indexers tagged flaresolverr fetch through this proxy
        - name: FlareSolverr
          type: FlareSolverr
          tags: [flaresolverr]
          fields:
            host: http://flaresolverr.servarr.svc.cluster.local:8191/
            requestTimeout: 60
    indexers:
      # kickasstorrents.to and .ws are deliberately not listed: both have been
      # failing for months and are being deleted by hand.
      data:
        # Newznab presets go by preset name. `definition: Newznab` would pick the
        # first preset (abNZB) as the template for any rewrite.
        - name: NZBgeek
          definition: NZBgeek
          enable: true
          priority: 15
          sync_profile: Standard
          tags: []
          fields:
            baseUrl: https://api.nzbgeek.info
            apiPath: /api
            apiKey: !env NZBGEEK_API_KEY
            vipExpiration: ""
            baseSettings.limitsUnit: 0
        - name: altHUB
          definition: altHUB
          enable: true
          priority: 15
          sync_profile: Standard
          tags: [flaresolverr]
          fields:
            baseUrl: https://api.althub.co.za
            apiPath: /api
            apiKey: !env ALTHUB_API_KEY
            vipExpiration: ""
            baseSettings.limitsUnit: 0
        - name: TorrentLeech
          definition: torrentleech
          enable: true
          priority: 25
          sync_profile: Standard
          tags: [flaresolverr]
          fields:
            definitionFile: torrentleech
            baseSettings.limitsUnit: 0
            torrentBaseSettings.seedRatio: 1
            torrentBaseSettings.preferMagnetUrl: false
            # Cardigann logins are compared as plain text, so these must match exactly
            username: !env TORRENTLEECH_USERNAME
            password: !env TORRENTLEECH_PASSWORD
            alt2fatoken: ""
            freeleech: false
            exclude_scene: false
            exclude_archives: false
            sort: 0
            type: 1
        - name: The Pirate Bay
          definition: thepiratebay
          enable: true
          priority: 25
          sync_profile: Standard
          tags: []
          fields:
            definitionFile: thepiratebay
            baseSettings.limitsUnit: 0
            torrentBaseSettings.seedRatio: 1
            torrentBaseSettings.preferMagnetUrl: false
            apiurl: apibay.org
            top100: 6
            uploader: ""
        - name: LimeTorrents
          definition: limetorrents
          enable: true
          priority: 25
          sync_profile: Standard
          tags: []
          fields:
            definitionFile: limetorrents
            baseSettings.limitsUnit: 0
            torrentBaseSettings.seedRatio: 1
            torrentBaseSettings.preferMagnetUrl: false
            primarydownloadlink: 1
            fallbackdownloadlink: 0
            sort: 0
        - name: TorrentDownload
          definition: torrentdownload
          enable: true
          priority: 25
          sync_profile: Standard
          tags: []
          fields:
            definitionFile: torrentdownload
            baseSettings.limitsUnit: 0
            torrentBaseSettings.preferMagnetUrl: false
            sort: 1
    applications:
      data:
        - name: Radarr
          type: Radarr
          sync_level: fullSync
          tags: []
          fields:
            prowlarrUrl: http://prowlarr.servarr.svc.cluster.local:9696
            baseUrl: http://radarr.servarr.svc.cluster.local:8989
            apiKey: !env RADARR_API_KEY
            syncCategories: [2000, 2010, 2020, 2030, 2040, 2045, 2050, 2060, 2070, 2080, 2090]
            syncRejectBlocklistedTorrentHashesWhileGrabbing: true
        - name: Sonarr
          type: Sonarr
          sync_level: fullSync
          tags: []
          fields:
            prowlarrUrl: http://prowlarr.servarr.svc.cluster.local:9696
            baseUrl: http://sonarr.servarr.svc.cluster.local:8989
            apiKey: !env SONARR_API_KEY
            syncCategories: [5000, 5010, 5020, 5030, 5040, 5045, 5050, 5090]
            animeSyncCategories: [5070]
            syncAnimeStandardFormatSearch: true
            syncRejectBlocklistedTorrentHashesWhileGrabbing: true
        - name: Lidarr
          type: Lidarr
          sync_level: fullSync
          tags: []
          fields:
            prowlarrUrl: http://prowlarr.servarr.svc.cluster.local:9696
            baseUrl: http://lidarr.servarr.svc.cluster.local:8686
            apiKey: !env LIDARR_API_KEY
            syncCategories: [3000, 3010, 3030, 3040, 3050, 3060]
            syncRejectBlocklistedTorrentHashesWhileGrabbing: false
        # Sportarr speaks Sonarr's API. It used to go out through the ingress
        # (https://sportarr.gregpakes.co.uk) and now stays in-cluster.
        - name: Sportarr
          type: Sonarr
          sync_level: fullSync
          tags: []
          fields:
            prowlarrUrl: http://prowlarr.servarr.svc.cluster.local:9696
            baseUrl: http://sportarr.servarr.svc.cluster.local:1867
            apiKey: !env SPORTARR_API_KEY
            syncCategories: [5010, 5020, 5030, 5040, 5045, 5050, 5060, 5090]
            animeSyncCategories: [5070]
            syncAnimeStandardFormatSearch: true
            syncRejectBlocklistedTorrentHashesWhileGrabbing: false
    # For grabs started from Prowlarr's own search page
    download_clients:
      update_password: false
      delete_unmanaged:
        enabled: false
      data:
        - name: NZBGet
          type: Nzbget
          enable: true
          priority: 1
          fields:
            host: download-clients-nzbgetui.servarr.svc.cluster.local
            port: 6789
            use_ssl: false
            username: !env NZBGET_USERNAME
            password: !env NZBGET_PASSWORD
            category: Prowlarr
            priority: 0
            add_paused: false
        - name: qBittorrent
          type: QBittorrent
          enable: true
          priority: 1
          fields:
            host: download-clients-webui.servarr.svc.cluster.local
            port: 8080
            use_ssl: false
            username: !env QBITTORRENT_USERNAME
            password: !env QBITTORRENT_PASSWORD
            category: Movies
            priority: 0
            initial_state: 0
            sequential_order: false
            first_and_last: false
            content_layout: 0
