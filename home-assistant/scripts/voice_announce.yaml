# Copy of the Home Assistant script "Announce to the house" (script.voice_announce),
# written by scripts/export-ha-config.py. Home Assistant is the live copy:
# change it there, then re-export. home-assistant/README.md says how to restore it.
alias: Announce to the house
description: >-
  Announce a spoken message to the whole house: every Echo and voice speaker. Use this for any request
  to announce, broadcast or tell everyone something, never HassBroadcast. Returns how many speakers it
  reached.
icon: mdi:bullhorn
mode: parallel
max: 5
fields:
  message:
    name: Message
    description: What to announce, as the person said it, e.g. "lunch is ready".
    required: true
    selector:
      text: {}
sequence:
  - variables:
      echos: >-
        {{ label_entities('announce') | select('match', 'media_player\.') | select('has_value') | list
        }}
      satellites: >-
        {{ label_entities('announce') | select('match', 'assist_satellite\.') | select('is_state', 'idle')
        | list }}
      result: '{{ {''speakers_reached'': echos | count + satellites | count} }}'
    note: >-
      Online Echos labelled Announce, and labelled satellites that are idle. The satellite handling this
      request is busy, so it is skipped.
  - if:
      - condition: template
        value_template: '{{ result.speakers_reached == 0 }}'
    then:
      - stop: No announcement speaker is online
        response_variable: result
  - parallel:
      - if:
          - condition: template
            value_template: '{{ echos | count > 0 }}'
        then:
          - action: notify.alexa_media
            data:
              message: '{{ message }}'
              target: '{{ echos }}'
              data:
                type: announce
            continue_on_error: true
      - if:
          - condition: template
            value_template: '{{ satellites | count > 0 }}'
        then:
          - action: assist_satellite.announce
            target:
              entity_id: '{{ satellites }}'
            data:
              message: '{{ message }}'
              preannounce: true
            continue_on_error: true
  - stop: Announced
    response_variable: result
