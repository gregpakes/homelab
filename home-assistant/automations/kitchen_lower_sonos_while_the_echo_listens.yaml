# Copy of the Home Assistant automation "Kitchen: lower Sonos while the Echo listens" (automation.kitchen_lower_sonos_while_the_echo_listens),
# written by scripts/export-ha-config.py. Home Assistant is the live copy:
# change it there, then re-export. home-assistant/README.md says how to restore it.
id: '1792565711045'
alias: 'Kitchen: lower Sonos while the Echo listens'
description: >-
  Drops the kitchen Sonos to 30% of its volume while the kitchen Echo listens and answers, then puts it
  back. A volume change made by voice during the request is carried over to the restored level.
triggers:
  - trigger: assist_satellite.listening
    target:
      entity_id: assist_satellite.echo_dot_2_15ecca_assist_satellite
conditions:
  - condition: media_player.is_playing
    target:
      entity_id: media_player.kitchen
actions:
  - variables:
      original_volume: '{{ state_attr(''media_player.kitchen'', ''volume_level'') | float(0) }}'
      ducked_volume: '{{ [original_volume, [(original_volume * 0.3) | round(2), 0.05] | max] | min }}'
  - action: media_player.volume_set
    target:
      entity_id: media_player.kitchen
    data:
      volume_level: '{{ ducked_volume }}'
  - wait_template: '{{ is_state(''assist_satellite.echo_dot_2_15ecca_assist_satellite'', ''idle'') }}'
    timeout: 00:02:00
  - alias: Restore, keeping any voice volume change made during the request
    action: media_player.volume_set
    target:
      entity_id: media_player.kitchen
    data:
      volume_level: >-
        {{ [[original_volume + (state_attr('media_player.kitchen', 'volume_level') | float(ducked_volume))
        - ducked_volume, 0] | max, 1] | min | round(2) }}
mode: single
max_exceeded: silent
