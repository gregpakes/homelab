# Copy of the Home Assistant automation "Music: download albums played from Spotify" (automation.music_download_albums_played_from_spotify),
# written by scripts/export-ha-config.py. Home Assistant is the live copy:
# change it there, then re-export. home-assistant/README.md says how to restore it.
id: '1792602065968'
alias: 'Music: download albums played from Spotify'
description: >-
  Whenever a Music Assistant player has been playing a Spotify track for 30 seconds, sends the album it's
  on to Lidarr (via the Lidarr request script), so it's available locally next time. Skipped tracks (under
  30 s) and further tracks from the same album are ignored. Reads the player's live state after the 30
  s, not trigger.to_state: when playback starts from a stopped player the track changes while the player
  is still 'idle', so to_state never says 'playing'.
triggers:
  - trigger: state
    entity_id:
      - media_player.kitchen_2
      - media_player.everywhere_2
      - media_player.greg_s_samsung_soundbar_q900a_2
      - media_player.alexa_dining_room_2
      - media_player.downstairs_2
      - media_player.alexa_kitchen_2
      - media_player.alexa_living_room
      - media_player.show_2
      - media_player.greg_s_sonos_era_100_2
      - media_player.kitchen_4
      - media_player.camille_s_echo_spot_2
      - media_player.sloane_s_echo_spot
    attribute: media_content_id
    for: 00:00:30
    note: >-
      Track changes keep the player 'playing', so the purpose-specific media_player triggers don't fire;
      the attribute trigger with for: 30s also ignores skipped tracks.
conditions:
  - alias: Still playing, and it's a Spotify track
    condition: template
    value_template: >-
      {{ now_playing.state == 'playing' and now_playing.content_id.startswith('spotify') }}
  - alias: Has an album and artist, and the album changed
    condition: template
    value_template: >-
      {{ now_playing.album != '' and now_playing.artist != '' and now_playing.album != (trigger.from_state.attributes.get('media_album_name')
      | default('', true) | string) }}
actions:
  - action: script.turn_on
    target:
      entity_id: script.voice_send_music_request_to_lidarr
    data:
      variables:
        kind: track
        name: '{{ now_playing.title }}'
        artist: '{{ now_playing.artist }}'
        album: '{{ now_playing.album }}'
mode: queued
max: 20
max_exceeded: silent
variables:
  now_playing: >-
    {{ {'state': states(trigger.entity_id), 'content_id': state_attr(trigger.entity_id, 'media_content_id')
    | default('', true) | string, 'title': state_attr(trigger.entity_id, 'media_title') | default('',
    true) | string, 'artist': (state_attr(trigger.entity_id, 'media_artist') | default('', true) | string).split('/')[0]
    | trim, 'album': state_attr(trigger.entity_id, 'media_album_name') | default('', true) | string} }}
