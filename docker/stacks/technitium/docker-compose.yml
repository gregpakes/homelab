---
# Technitium DNS - one node of the HA pair. The same file is deployed twice, as a
# Git-backed Portainer stack on dns1 and on dns2, with per-node env vars set in
# Portainer. keepalived runs natively on each host, not here - see README.md.
services:
  technitium:
    image: technitium/dns-server:15.6.1
    container_name: technitium
    restart: unless-stopped
    # Host networking so the node answers on the keepalived VIP as soon as it lands
    # on this host, and sees real client IPs rather than the Docker bridge.
    network_mode: host
    environment:
      TZ: ${TZ:-Europe/London}
      # Everything below is read only on first start, while /etc/dns is empty.
      # After that the config lives in /srv/technitium/config and the cluster
      # syncs it from dns1, so change settings in the web console, not here.
      DNS_SERVER_DOMAIN: ${DNS_SERVER_DOMAIN:?set per node in Portainer, e.g. dns1.gregpakes.co.uk}
      DNS_SERVER_ADMIN_PASSWORD: ${DNS_SERVER_ADMIN_PASSWORD:?set in Portainer}
      DNS_SERVER_FORWARDERS: ${DNS_SERVER_FORWARDERS:?set in Portainer, see README.md}
      DNS_SERVER_FORWARDER_PROTOCOL: Https
      # Clustering talks to the other node over the HTTPS web service (53443).
      DNS_SERVER_WEB_SERVICE_ENABLE_HTTPS: "true"
      DNS_SERVER_WEB_SERVICE_USE_SELF_SIGNED_CERT: "true"
      DNS_SERVER_ENABLE_BLOCKING: "true"
      DNS_SERVER_LOG_USING_LOCAL_TIME: "true"
    volumes:
      - /srv/technitium/config:/etc/dns
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5380/api/dnsClient/healthCheck | grep -q '\"status\":\"ok\"'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
